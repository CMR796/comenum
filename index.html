<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Comenum</title>
<meta name="theme-color" content="#4b2c82">
<meta name="description" content="Comenum">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comenum">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --n1: #ff7b54; --n2: #ffb347; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }
  #app {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  /* Barra superior */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,.18);
    font-size: 14px; font-weight: 700;
  }
  .topbar .spacer { flex: 1; }
  .ib {
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .ib:active { transform: scale(.92); }

  /* Puntuación */
  #scoreWrap { text-align: center; padding: 8px 0 4px; }
  #scoreWrap .lbl { font-size: 13px; opacity: .85; letter-spacing: 1px; text-transform: uppercase; }
  #score { font-size: 54px; font-weight: 900; color: #ffd23f; text-shadow: 0 3px 8px rgba(0,0,0,.35); line-height: 1.05; }
  #prog { width: 55%; height: 7px; margin: 6px auto 0; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
  #progBar { display: block; height: 100%; width: 0; background: #7dffb0; transition: width .2s; }

  /* Combo */
  #combo {
    height: 26px; margin-top: 4px; font-size: 19px; font-weight: 900; letter-spacing: .5px;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.45); opacity: 0; transition: opacity .2s;
  }
  #combo.on { opacity: 1; }
  #combo[data-m="2"] { color: #ffe66d; }
  #combo[data-m="3"] { color: #ffb347; }
  #combo[data-m="4"] { color: #ff7b54; }
  #combo[data-m="5"] { color: #ff4d6d; }
  #combo.pulse { animation: comboPulse .4s; }
  @keyframes comboPulse { 50% { transform: scale(1.35); } }

  /* Franja de números */
  #strip {
    position: relative; height: 60px; margin: 6px 10px 0;
    background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.28);
    border-radius: 14px; overflow: hidden;
  }
  #strip::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; z-index: 2;
    background: linear-gradient(90deg, rgba(255,60,60,.65), transparent);
  }
  .num {
    position: absolute; left: 0; top: 8px; width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: 800; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    background: linear-gradient(135deg, var(--n1), var(--n2));
    box-shadow: 0 3px 8px rgba(0,0,0,.25);
    will-change: transform;
  }
  .num.gold {
    background: linear-gradient(135deg, #fff176, #ffb300); color: #5a3a00; text-shadow: none;
    box-shadow: 0 0 12px rgba(255,215,0,.9), 0 3px 8px rgba(0,0,0,.25);
  }
  .num.gold::after {
    content: "★"; position: absolute; top: -6px; right: -3px; font-size: 15px; color: #fff;
    text-shadow: 0 0 4px #ff9800, 0 0 2px #000;
  }
  .num.wild {
    background: conic-gradient(#ff5e62, #ffd200, #43e97b, #4facfe, #a18cd1, #ff5e62);
    font-size: 24px;
  }
  .num.first { box-shadow: 0 0 0 3px #fff, 0 0 14px rgba(255,255,255,.9); }
  .num.gold.first { box-shadow: 0 0 0 3px #fff, 0 0 16px rgba(255,215,0,.95); }

  /* Zona de juego (sorpresas) */
  #area { position: relative; flex: 1; }
  #effect {
    position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-weight: 800; font-size: 15px; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .sup {
    position: absolute; width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: radial-gradient(circle at 30% 30%, #fff, #ffe6a8);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    animation: floaty 1.6s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .pts {
    position: absolute; left: 50%; bottom: 6px; pointer-events: none;
    font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5);
    animation: ptsUp .9s ease-out forwards;
  }
  .pts.gold { color: #ffe14d; font-size: 28px; }
  @keyframes ptsUp {
    0%   { opacity: 0; transform: translate(-50%, 10px) scale(.7); }
    20%  { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -42px) scale(1); }
  }

  /* Controles */
  .controls {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    height: 66px; margin: 26px 16px 34px;
    background: linear-gradient(#2f7de1, #1a56b8);
    border-radius: 33px;
    box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.2);
  }
  .cbtn {
    flex: 1; height: 100%; background: transparent; border: none; color: #fff;
    font-size: 42px; font-weight: 300; cursor: pointer;
  }
  .cbtn:active { background: rgba(255,255,255,.15); }
  #minus { border-radius: 33px 0 0 33px; padding-right: 40px; }
  #plus  { border-radius: 0 33px 33px 0; padding-left: 40px; }
  #display {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 96px; height: 96px; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fff3a0, #ffc400);
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
  }
  #display span {
    width: 66px; height: 66px; border-radius: 50%; background: #fff; color: #2b2150;
    display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800;
  }
  #display:active { transform: translate(-50%, -50%) scale(.95); }
  #display.ok { animation: pop .35s; }
  #display.bad { animation: shake .3s; }
  @keyframes pop { 50% { transform: translate(-50%, -50%) scale(1.15); } }
  @keyframes shake { 25% { transform: translate(-56%, -50%); } 75% { transform: translate(-44%, -50%); } }

  /* Mensajes flotantes */
  #toast {
    position: absolute; left: 50%; top: 42%; z-index: 50; pointer-events: none;
    transform: translate(-50%, -50%); opacity: 0;
    max-width: 85%; text-align: center; padding: 16px 22px; border-radius: 20px;
    font-size: 19px; font-weight: 800; color: #fff;
    background: rgba(255,90,90,.95); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #toast.good { background: rgba(40,190,110,.95); }
  #toast.show { animation: toastAnim 2s forwards; }
  @keyframes toastAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  #achToast {
    position: absolute; left: 50%; top: 58px; z-index: 60; pointer-events: none;
    transform: translateX(-50%); opacity: 0; max-width: 92%; text-align: center;
    padding: 10px 16px; border-radius: 16px; font-size: 14px; font-weight: 800; color: #3d2b00;
    background: linear-gradient(135deg, #ffe259, #ffa751); box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  #achToast.show { animation: achAnim 3s forwards; }
  @keyframes achAnim {
    0%   { opacity: 0; transform: translate(-50%, -14px); }
    10%  { opacity: 1; transform: translate(-50%, 0); }
    85%  { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 0); }
  }

  /* Ventanas */
  .overlay {
    position: absolute; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(15,8,40,.78);
  }
  .overlay.open { display: flex; }
  .card {
    width: min(88%, 340px); max-height: 94%; overflow-y: auto;
    padding: 22px 20px; border-radius: 24px; text-align: center;
    background: rgba(255,255,255,.97); color: #2b2150; box-shadow: 0 14px 40px rgba(0,0,0,.4);
  }
  .card h1 { font-size: 40px; letter-spacing: 1px; color: #5b3ea8; margin-bottom: 4px; }
  .card h2 { font-size: 26px; margin-bottom: 10px; color: #d94a4a; }
  .card h3 { font-size: 22px; margin-bottom: 10px; color: #5b3ea8; }
  .card p { margin: 6px 0; font-size: 15px; line-height: 1.4; }
  .card ul { text-align: left; margin: 8px 0 4px 20px; font-size: 14px; line-height: 1.5; }
  .card li { margin-bottom: 4px; }
  .big { font-size: 34px; font-weight: 900; color: #e6a100; }
  .info { font-size: 13px; opacity: .85; }
  .btn {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .btn small { display: block; font-size: 12px; font-weight: 600; opacity: .92; margin-top: 2px; }
  .btn.green { background: linear-gradient(135deg, #25d366, #128c7e); }
  .btn.orange { background: linear-gradient(135deg, #ff9a56, #e0455a); }
  .btn.ghost { background: #eee; color: #4b2c82; }
  .btn:active { transform: scale(.97); }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .btn { font-size: 14px; padding: 10px 6px; }
  .hidden { display: none !important; }

  /* Reto de amigo (banner) */
  .banner {
    background: #fff1d6; border: 2px solid #ffb347; border-radius: 14px;
    padding: 10px; margin: 10px 0 0; font-weight: 800; font-size: 14px; color: #6b3b00;
  }
  .banner .btn { margin-top: 8px; }

  /* Selector de nivel inicial */
  #levelPick { margin: 10px 0 2px; }
  #levelPick .lpLabel { font-size: 14px; font-weight: 700; color: #4b2c82; }
  .picker { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 6px; }
  .picker button {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: #5b3ea8; color: #fff; font-size: 26px; line-height: 1;
  }
  .picker button:active { transform: scale(.92); }
  .picker b { font-size: 32px; min-width: 44px; color: #5b3ea8; }

  /* Selector de idioma */
  #langSel {
    margin-top: 12px; padding: 7px 10px; border-radius: 10px; border: 1px solid #ccc;
    font-size: 14px; background: #fff; color: #2b2150;
  }

  /* Logros y temas */
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-top: 7px;
    border-radius: 12px; background: #f1eefb; font-size: 14px; text-align: left;
  }
  .row .sw { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }
  .row .ic { width: 30px; font-size: 22px; text-align: center; flex: none; }
  .row .tx { flex: 1; line-height: 1.25; font-weight: 700; }
  .row .tx small { display: block; font-weight: 400; opacity: .75; font-size: 12px; }
  .row .st { font-size: 13px; font-weight: 800; color: #5b3ea8; flex: none; }
  .row.can { cursor: pointer; }
  .row.lock { opacity: .6; }
  .row.sel { outline: 3px solid #5b3ea8; }
  .row.done { background: #e4f7ea; }
  .cnt { font-size: 13px; opacity: .75; margin-bottom: 2px; }

  /* Estadísticas */
  .tip { background: #fff6d6; border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.4; margin: 8px 0; text-align: left; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .metric { background: #f1eefb; border-radius: 12px; padding: 10px 6px; }
  .metric b { display: block; font-size: 22px; color: #5b3ea8; }
  .metric span { font-size: 12px; opacity: .8; }
  .sec { font-size: 15px; font-weight: 800; color: #5b3ea8; margin-top: 14px; text-align: left; }
  .bar { height: 10px; border-radius: 6px; background: #e3def5; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: #43c68c; }
  .chips { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .chip {
    min-width: 54px; padding: 7px 12px; border-radius: 999px; border: 2px solid #5b3ea8;
    background: #fff; color: #5b3ea8; font-weight: 800; font-size: 15px; cursor: pointer;
  }
  .chip.sel { background: #5b3ea8; color: #fff; }
  .wk { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; text-align: left; }
  .wk .l { width: 74px; flex: none; }
  .wk .bar { flex: 1; margin-top: 0; }
  .wk .v { width: 58px; text-align: right; font-weight: 800; flex: none; }

  /* Mensajes de fin de partida */
  .msgs p { background: #f1eefb; border-radius: 10px; padding: 7px 10px; font-size: 14px; margin: 6px 0; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div>❤️ <b id="lives">3</b></div>
    <div>⏱️ <b id="time">00:00</b></div>
    <div><span data-i18n="level"></span> <b id="level">1</b></div>
    <div class="spacer"></div>
    <button class="ib" id="btnSound" aria-label="Sound">🔊</button>
    <button class="ib" id="btnPause" aria-label="Pause">⏸️</button>
    <button class="ib" id="btnHelp" aria-label="Help">❓</button>
  </div>

  <div id="scoreWrap">
    <div class="lbl" id="scoreLbl"></div>
    <div id="score">0</div>
    <div id="prog"><i id="progBar"></i></div>
    <div id="combo"></div>
  </div>

  <div id="strip"></div>

  <div id="area"><div id="effect"></div></div>

  <div class="controls">
    <button class="cbtn" id="minus" aria-label="-">−</button>
    <button class="cbtn" id="plus" aria-label="+">+</button>
    <div id="display"><span id="dispNum">1</span></div>
  </div>

  <div id="toast"></div>
  <div id="achToast"></div>

  <!-- Inicio -->
  <div class="overlay open" id="ovStart">
    <div class="card">
      <h1>Comenum</h1>
      <p data-i18n="tagline"></p>
      <p><span data-i18n="record"></span>: <span class="big" id="bestStart">0</span></p>
      <p class="info" id="startInfo"></p>
      <div id="chBanner" class="banner hidden">
        <div id="chText"></div>
        <button class="btn orange" id="btnAccept" data-i18n="ch_accept"></button>
      </div>
      <div id="levelPick" class="hidden">
        <div class="lpLabel" data-i18n="start_level"></div>
        <div class="picker">
          <button id="lvMinus" aria-label="-">−</button>
          <b id="lvVal">1</b>
          <button id="lvPlus" aria-label="+">+</button>
        </div>
      </div>
      <button class="btn" id="btnPlay" data-i18n="play"></button>
      <button class="btn orange" id="btnDaily"><span data-i18n="daily_btn"></span><small id="dailySub"></small></button>
      <button class="btn green" id="btnShareStart" data-i18n="share"></button>
      <div class="btnrow">
        <button class="btn ghost" id="btnStats" data-i18n="stats_btn"></button>
        <button class="btn ghost" id="btnAch" data-i18n="ach_btn"></button>
      </div>
      <div class="btnrow">
        <button class="btn ghost" id="btnHowTo" data-i18n="howto"></button>
        <button class="btn ghost" id="btnInstall" data-i18n="install"></button>
      </div>
      <select id="langSel" aria-label="Language"></select>
    </div>
  </div>

  <!-- Pausa -->
  <div class="overlay" id="ovPause">
    <div class="card">
      <h3 data-i18n="pause_title"></h3>
      <button class="btn" id="btnResume" data-i18n="resume"></button>
    </div>
  </div>

  <!-- Ayuda -->
  <div class="overlay" id="ovHelp" style="z-index:110">
    <div class="card">
      <h3 data-i18n="help_title"></h3>
      <ul>
        <li data-i18n="help1"></li>
        <li data-i18n="help2"></li>
        <li data-i18n="help3"></li>
        <li data-i18n="help4"></li>
        <li data-i18n="help5"></li>
        <li data-i18n="help7"></li>
        <li data-i18n="help8"></li>
        <li data-i18n="help9"></li>
        <li data-i18n="help10"></li>
        <li data-i18n="help6"></li>
      </ul>
      <button class="btn" id="btnHelpClose" data-i18n="ok"></button>
    </div>
  </div>

  <!-- Instalar en iPhone -->
  <div class="overlay" id="ovIOS" style="z-index:110">
    <div class="card">
      <h3 data-i18n="ios_title"></h3>
      <p data-i18n="ios1"></p>
      <p data-i18n="ios2"></p>
      <p data-i18n="ios3"></p>
      <button class="btn" id="btnIOSClose" data-i18n="ok"></button>
    </div>
  </div>

  <!-- Fin de partida -->
  <div class="overlay" id="ovOver">
    <div class="card">
      <h2 data-i18n="over_title"></h2>
      <p id="newRecord" class="hidden"><b data-i18n="new_record"></b></p>
      <p><span data-i18n="score"></span>: <span class="big" id="finalScore">0</span></p>
      <p><span data-i18n="level"></span>: <b id="finalLevel">1</b> · <span data-i18n="time"></span>: <b id="finalTime">00:00</b></p>
      <p id="goReact" class="hidden"></p>
      <p><span data-i18n="streak_best"></span>: <b id="finalStreak">0</b> · <span data-i18n="record"></span>: <b id="finalBest">0</b></p>
      <div class="msgs" id="goMsgs"></div>
      <button class="btn" id="btnAgain" data-i18n="again"></button>
      <button class="btn orange" id="btnChallenge" data-i18n="ch_btn"></button>
      <button class="btn green" id="btnShareOver" data-i18n="share_score"></button>
      <button class="btn ghost" id="btnMenu" data-i18n="menu_btn"></button>
    </div>
  </div>

  <!-- Logros y temas -->
  <div class="overlay" id="ovAch">
    <div class="card">
      <h3 data-i18n="themes_title"></h3>
      <div id="themeList"></div>
      <h3 data-i18n="ach_list_title" style="margin-top:18px"></h3>
      <p class="cnt" id="achCount"></p>
      <div id="achList"></div>
      <button class="btn" id="btnAchClose" data-i18n="close"></button>
    </div>
  </div>

  <!-- Estadísticas -->
  <div class="overlay" id="ovStats">
    <div class="card">
      <h3 data-i18n="stats_title"></h3>
      <div id="statsBody"></div>
      <button class="btn" id="btnStatsClose" data-i18n="close"></button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------- Constantes de juego ----------
  const NUM = 40;            // diámetro de cada número (px)
  const SPACING = 45;        // distancia entre números (px) -> 1,8 s a velocidad inicial
  const BASE_SPEED = 25;     // px/segundo en el nivel 1
  const MAX_LIVES = 6;
  const COMBO_STEP = 5;      // cada cuántos números seguidos sube el multiplicador
  const MAX_MULT = 5;        // multiplicador máximo
  const P_WILD = 0.06;       // probabilidad de comodín
  const P_GOLD = 0.09;       // probabilidad de número dorado
  const MIN_REACT = 120;     // ms: tiempos menores se descartan (medición poco fiable)
  const MAX_REACT = 8000;    // ms: tiempos mayores se recortan para no distorsionar la media
  const GOALS = [5, 10, 20]; // objetivos semanales posibles (partidas)

  // ---------- Estadísticas anónimas (GoatCounter) ----------
  function track(path, title) {
    try {
      if (window.goatcounter && typeof window.goatcounter.count === 'function') {
        window.goatcounter.count({ path: path, title: title || path, event: true });
      }
    } catch (e) {}
  }

  // ---------- Fechas y semillas ----------
  const pad2 = n => String(n).padStart(2, '0');
  function dateKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function weekKey(d) {   // lunes de la semana
    d = d || new Date();
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return dateKey(x);
  }
  function yesterdayKey() { const x = new Date(); x.setDate(x.getDate() - 1); return dateKey(x); }
  function dayNumber() {  // nº del reto diario (el día 1 es el 23/11/2026)
    const a = Date.UTC(2026, 10, 23);
    const n = new Date();

  function saveAll() {
    try { stats.streak = Math.max(stats.streak, (S && S.bestStreak) || 0); } catch (e) {}

    const today = dateKey();

    days.streak = (days.last === yesterdayKey()) ? days.streak + 1 : 1;
    days.best = Math.max(days.best, days.streak);

    return { seed: m[1], score: parseInt(m[2], 10), lv: Math.max(1, Math.min(100, parseInt(m[3], 10))) };

  // ---------- Audio ----------
  let audioCtx = null, master = null, musicTimer = null, step = 0;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      master = audioCtx.createGain();
      master.gain.value = 1;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state !== 'running') { try { audioCtx.resume(); } catch (e) {} }
  }
  function tone(f, d, type = 'sine', v = 0.12, delay = 0, to = null) {
    if (!audioCtx || muted) return;
    const tm = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, tm);
    if (to) o.frequency.exponentialRampToValueAtTime(to, tm + d);
    g.gain.setValueAtTime(v, tm);
    g.gain.exponentialRampToValueAtTime(0.001, tm + d);
    o.connect(g); g.connect(master);
    o.start(tm); o.stop(tm + d + 0.03);
  }
  const SFX = {
    eat:    () => { tone(660, .09, 'square', .09); tone(990, .12, 'square', .09, .07); },
    gold:   () => { tone(1047, .1, 'triangle', .13); tone(1319, .1, 'triangle', .13, .08); tone(1568, .18, 'triangle', .13, .16); },
    combo:  () => { tone(784, .08, 'triangle', .12, .12); tone(1175, .16, 'triangle', .12, .2); },
    ach:    () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .16, 'triangle', .13, .15 + i * .09)),
    button: () => tone(520, .05, 'triangle', .12),
    wrong:  () => tone(160, .18, 'sawtooth', .09),
    lose:   () => { tone(400, .5, 'sawtooth', .12, 0, 90); },
    level:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .14, i * .1)),
    sup:    () => { tone(1200, .1, 'sine', .12); tone(1600, .15, 'sine', .12, .08); },
    over:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, .3, 'triangle', .14, i * .22))
  };
  const sfx = n => { try { SFX[n](); } catch (e) {} };

  const PENT = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
  const MELODY = [0,2,4,2,5,4,2,-1, 0,2,4,7,5,4,2,-1, 3,5,6,5,4,2,0,-1, 0,2,4,5,4,2,0,-1];
  const BASS = [130.81, 98, 110, 87.31];
  function musicTick() {
    musicTimer = setTimeout(musicTick, Math.max(130, 230 - (S.level - 1) * 10));
    if (!S.playing || S.paused || !audioCtx) return;
    const m = MELODY[step % MELODY.length];
    if (m >= 0) tone(PENT[m], .18, 'triangle', .05);

    step++;
  }
  function startMusic() { clearTimeout(musicTimer); step = 0; musicTick(); }

  const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  function open(id) { $(id).classList.add('open'); }

  // Pantalla de inicio: récord, rachas, reto diario, reto de amigo y selector de nivel

  // ---------- Logros ----------
  function achText(a) {
    return t('ach_' + a.type, { n: a.n.toLocaleString(lang), s: secNum(a.n), m: a.min || 0 });
  }
  function achCur(type) {
    switch (type) {
      case 'eat':    return stats.eaten;
      case 'streak': return Math.max(stats.streak, S.bestStreak || 0);
      case 'level':  return Math.max(maxLevel, S.level);
      case 'score':  return Math.max(best, S.score);
      case 'gold':   return stats.gold;
      case 'wild':   return stats.wild;
      case 'games':  return stats.games;
      case 'days':   return Math.max(days.best, days.streak);
      case 'daily':  return stats.daily;
      case 'weeks':  return stats.weeksDone;
    }
    return 0;
  }
  function achDone(a) {
    if (a.type === 'rbest') return stats.rbest > 0 && stats.rbest <= a.n;
    if (a.type === 'ravg')  return S.rn >= a.min && (S.rsum / S.rn) <= a.n;
    return achCur(a.type) >= a.n;
  }
  let achQueue = [], achBusy = false;

  }
  function checkAchievements() {

        changed = true;

  // ---------- Panel de estadísticas ----------
  function weekLabel(k) {
    const p = k.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(lang, { day: '2-digit', month: '2-digit' });
  }
  function renderStats() {
    const box = $('statsBody');
    box.innerHTML = '';
    const tips = T.tips || I18N.en.tips;
    box.appendChild(mk('div', 'tip', '💡 ' + tips[dayNumber() % tips.length]));

    const avg = stats.rn > 0 ? stats.rsum / stats.rn : 0;
    const tot = stats.ok + stats.bad;
    const grid = mk('div', 'metrics');
    [
      [avg ? fmtSec(avg) : '—', 'st_react_avg'],
      [stats.rbest ? fmtSec(stats.rbest) : '—', 'st_react_best'],
      [tot ? Math.round(stats.ok / tot * 100) + '%' : '—', 'st_acc'],
      [String(stats.games), 'st_games']
    ].forEach(it => {
      const m = mk('div', 'metric');
      m.appendChild(mk('b', '', it[0]));
      m.appendChild(mk('span', '', t(it[1])));
      grid.appendChild(m);
    });
    box.appendChild(grid);

    // Racha de días
    const ds = currentDayStreak();
    box.appendChild(mk('div', 'sec', '🔥 ' + t('st_days') + ': ' + ds + '  (' + t('st_days_best', { d: Math.max(days.best, ds) }) + ')'));

    // Objetivo semanal
    box.appendChild(mk('div', 'sec', '🎯 ' + t('st_goal')));
    const wk = weeks[weekKey()];
    const games = wk ? wk.games : 0;
    const bar = mk('div', 'bar');
    const fill = document.createElement('i');
    fill.style.width = Math.min(100, games / goal * 100) + '%';
    bar.appendChild(fill);
    box.appendChild(bar);
    box.appendChild(mk('p', 'info', t('st_goal_prog', { g: games, n: goal })));
    const chips = mk('div', 'chips');
    GOALS.forEach(n => {
      const c = mk('button', 'chip' + (n === goal ? ' sel' : ''), String(n));
      c.addEventListener('click', () => {
        goal = n; lsSet('comenum_goal', String(n));
        sfx('button'); renderStats(); refreshStart();
      });
      chips.appendChild(c);
    });
    box.appendChild(chips);

    // Evolución semanal
    box.appendChild(mk('div', 'sec', '📈 ' + t('st_weeks')));
    const keys = Object.keys(weeks).filter(k => weeks[k].n > 0).sort().reverse().slice(0, 6);
    if (!keys.length) {
      box.appendChild(mk('p', '', t('st_nodata')));
    } else {
      const maxAvg = Math.max.apply(null, keys.map(k => weeks[k].sum / weeks[k].n));
      keys.forEach(k => {
        const w = weeks[k], a = w.sum / w.n;
        const row = mk('div', 'wk');
        row.appendChild(mk('span', 'l', k === weekKey() ? t('st_this') : weekLabel(k)));
        const b2 = mk('div', 'bar');
        const f2 = document.createElement('i');
        f2.style.width = Math.max(8, a / maxAvg * 100) + '%';
        b2.appendChild(f2);
        row.appendChild(b2);
        row.appendChild(mk('span', 'v', fmtSec(a)));
        box.appendChild(row);
      });
      box.appendChild(mk('div', 'cnt', t('st_less')));
      const cur = weeks[weekKey()];
      const prevKey = Object.keys(weeks).sort().reverse().find(k => k !== weekKey() && weeks[k].n >= 10);
      if (cur && cur.n >= 10 && prevKey) {
        const ca = cur.sum / cur.n, pa = weeks[prevKey].sum / weeks[prevKey].n;
        const p = Math.round((pa - ca) / pa * 100);
        box.appendChild(mk('div', 'tip', p >= 3 ? t('st_trend_up', { p: p }) : (p <= -3 ? t('st_trend_down') : t('st_trend_flat'))));
      }
    }
  }

  // ---------- Números ----------
  function spawnNumber(overshoot) {
    const rnd = S.rng;
    const el = document.createElement('div');
    const r = rnd();
    let kind = 'normal';
    if (r < P_WILD) kind = 'wild';
    else if (r < P_WILD + P_GOLD) kind = 'gold';
    el.className = 'num' + (kind !== 'normal' ? ' ' + kind : '');
    const v = kind === 'wild' ? -1 : Math.floor(rnd() * 10);
    el.textContent = kind === 'wild' ? '?' : v;
    $('strip').appendChild(el);
    const x = $('strip').clientWidth - NUM - 6 - overshoot;
    S.numbers.push({ v, x, el, kind });
  }
  function removeNumber(i) {
    const n = S.numbers.splice(i, 1)[0];
    if (n) n.el.remove();
  }
  function clearNumbers() {
    S.numbers.forEach(n => n.el.remove());
    S.numbers = [];
  }

  // ---------- Reglas ----------
  // Da los puntos de un número comido. viaEat = true si se comió con el visor (suma racha).
  function awardNumber(n, viaEat) {
    if (viaEat) {
      S.streak++;
      if (S.streak > S.bestStreak) S.bestStreak = S.streak;
    }
    const gold = n.kind === 'gold';
    const pts = 10 * S.level * mult() * (gold ? 3 : 1);
    S.score += pts;
    S.eaten++;
    stats.eaten++;
    if (gold) stats.gold++;
    if (n.kind === 'wild') stats.wild++;
    return pts;
  }
  function breakStreak() {
    if (S.streak > 0) { S.streak = 0; updateCombo(false); }
  }
  function checkLevel() {
    if (S.eaten >= S.goal) {
      S.level++;
      S.eaten = 0;
      S.goal = 10 + (S.level - 1) * 5;
      if (S.level > maxLevel) { maxLevel = S.level; lsSet('comenum_maxlevel', String(maxLevel)); }
      setBackground(S.level);
      toast(t('level_up', { n: S.level }), 'good');
      sfx('level');
    }
  }
  function checkChallenge() {
    if (S.mode === 'challenge' && !S.passed && S.target > 0 && S.score > S.target) {
      S.passed = true;
      toast(t('ch_passed'), 'good');
    }
  }
  function recordHit(ms) {
    S.ok++; stats.ok++;
    const w = curWeek();
    w.ok++;
    if (ms >= MIN_REACT) {
      ms = Math.min(ms, MAX_REACT);
      S.rn++; S.rsum += ms; if (!S.rbest || ms < S.rbest) S.rbest = ms;
      stats.rn++; stats.rsum += ms; if (!stats.rbest || ms < stats.rbest) stats.rbest = ms;
      w.n++; w.sum += ms;
    }
    if (S.ok === 1) touchDay();
  }
  function recordMiss() {
    S.bad++; stats.bad++;
    curWeek().bad++;
  }
  function eat() {
    if (!S.playing || S.paused) return;
    const n = S.numbers[0];
    if (!n) return;   // no hay nada que comer: no cuenta como fallo
    const d = $('display');
    d.classList.remove('ok', 'bad'); void d.offsetWidth;
    if (n.kind === 'wild' || n.v === S.player) {
      const ms = (S.curFirst === n) ? Math.round((S.time - S.firstSince) * 1000) : -1;
      removeNumber(0);
      const before = mult();
      const pts = awardNumber(n, true);
      const after = mult();
      recordHit(ms);
      sfx(n.kind === 'gold' ? 'gold' : 'eat');
      if (after > before) sfx('combo');
      d.classList.add('ok');
      popPoints('+' + pts, n.kind === 'gold' ? 'gold' : '');
      updateCombo(after > before);
      checkLevel();
      checkChallenge();
      checkAchievements();
    } else {
      recordMiss();
      sfx('wrong');
      vibrate(40);
      d.classList.add('bad');
      breakStreak();
    }
    hud();
  }
  function change(delta) {
    if (!S.playing || S.paused) return;
    S.player = (S.player + delta + 10) % 10;
    sfx('button'); vibrate(20);
    hud();
  }
  function loseLife() {
    S.lives--;
    breakStreak();
    clearNumbers();           // respiro para el jugador
    S.breath = 2;             // 2 s sin números nuevos
    S.dist = SPACING;
    S.speedMult = 1; S.effectLeft = 0; $('effect').textContent = '';
    sfx('lose'); vibrate([120, 60, 120]);
    const f = T.funny;
    toast(f[Math.floor(Math.random() * f.length)]);
    hud();
    if (S.lives <= 0) {
      S.playing = false;
      stopMusic();
      setTimeout(showGameOver, 1900);
    }
  }

  // ---------- Sorpresas ----------
  function spawnSurprise() {
    const types = ['slow', 'fast', 'clear'];
    if (S.lives < MAX_LIVES) types.push('life', 'life');
    const type = types[Math.floor(Math.random() * types.length)];
    const icons = { life: '❤️', slow: '🐌', fast: '⚡', clear: '💥' };
    const area = $('area');
    const w = area.clientWidth, h = area.clientHeight;
    if (h < 90) return;
    const el = document.createElement('div');
    el.className = 'sup';
    el.textContent = icons[type];
    el.style.left = (8 + Math.random() * (w - 72)) + 'px';
    el.style.top = (28 + Math.random() * Math.max(1, h - 100)) + 'px';
    const sup = { el, type, ttl: 4 };
    el.addEventListener('pointerdown', e => { e.preventDefault(); activateSurprise(sup); });
    area.appendChild(el);
    S.surprises.push(sup);
  }
  function removeSurprise(sup) {
    sup.el.remove();
    S.surprises = S.surprises.filter(s => s !== sup);
  }
  function activateSurprise(sup) {
    if (!S.playing || S.paused) return;
    removeSurprise(sup);
    sfx('sup'); vibrate(30);
    switch (sup.type) {
      case 'life':
        if (S.lives < MAX_LIVES) S.lives++;
        toast(t('life_extra'), 'good');
        break;
      case 'slow':
        S.speedMult = 0.5; S.effectLeft = 6; S.effectKey = 'slower';
        break;
      case 'fast':
        S.speedMult = 1.6; S.effectLeft = 5; S.effectKey = 'faster';
        break;
      case 'clear': {
        let total = 0;
        for (let k = 0; k < 4 && S.numbers.length; k++) {
          const n = S.numbers[0];
          removeNumber(0);
          total += awardNumber(n, false);   // da puntos, pero no suma racha ni reacción
        }
        if (total > 0) popPoints('+' + total);
        checkLevel();
        toast(t('eaten'), 'good');
        checkChallenge();
        checkAchievements();
        break;
      }
    }
    hud();
  }
  function grabSurprise() {
    if (S.surprises.length) activateSurprise(S.surprises[0]);
  }

  // ---------- Bucle principal ----------
  let last = 0, lastSec = -1;
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min((ts - last) / 1000, 0.1);
    last = ts;
    if (!S.playing || S.paused) return;

    S.time += dt;
    const sec = Math.floor(S.time);
    if (sec !== lastSec) { lastSec = sec; $('time').textContent = fmt(S.time); }

    // Efectos temporales
    if (S.effectLeft > 0) {
      S.effectLeft -= dt;
      if (S.effectLeft <= 0) { S.speedMult = 1; $('effect').textContent = ''; }
      else $('effect').textContent = t(S.effectKey) + ' ' + Math.ceil(S.effectLeft) + 's';
    }

    // Movimiento
    const speed = BASE_SPEED * (1 + 0.25 * (S.level - 1)) * S.speedMult;
    const move = speed * dt;
    S.numbers.forEach(n => { n.x -= move; });

    // Aparición de números (siempre a la misma distancia entre ellos)
    if (S.breath > 0) {
      S.breath -= dt;
    } else {
      S.dist += move;
      while (S.dist >= SPACING) {
        S.dist -= SPACING;
        spawnNumber(S.dist);
      }
    }

    // Reacción: momento en que un número pasa a ser el primero de la fila
    const f = S.numbers[0] || null;
    if (f !== S.curFirst) { S.curFirst = f; S.firstSince = S.time; }

    // ¿Algún número toca el borde izquierdo?
    if (S.numbers.length && S.numbers[0].x <= 0) {
      loseLife();
      if (!S.playing) return;
    }

    // Pintar
    S.numbers.forEach((n, i) => {
      n.el.style.transform = 'translateX(' + n.x.toFixed(1) + 'px)';
      n.el.classList.toggle('first', i === 0);
    });

    // Sorpresas
    S.nextSurprise -= dt;
    if (S.nextSurprise <= 0) {
      S.nextSurprise = 9 + Math.random() * 7;
      if (S.surprises.length === 0) spawnSurprise();
    }
    S.surprises.slice().forEach(s => { s.ttl -= dt; if (s.ttl <= 0) removeSurprise(s); });
  }

  // ---------- Flujo de partida ----------
  function startGame(mode) {
    ensureAudio();
    clearNumbers();
    S.surprises.forEach(s => s.el.remove());
    let lv = 1, seed, target = 0;
    if (mode === 'daily') {
      seed = 'daily-' + dateKey();
    } else if (mode === 'challenge' && pendingChallenge) {
      lv = pendingChallenge.lv; seed = pendingChallenge.seed; target = pendingChallenge.score;
      pendingChallenge = null;
      clearHash();
    } else {
      mode = 'normal';
      lv = Math.min(Math.max(1, startLevel), maxLevel);
      seed = randomSeed();
    }
    S = newState(lv, mode, seed);
    S.target = target;
    S.playing = true;
    lastSec = -1;
    $('time').textContent = '00:00';
    $('effect').textContent = '';
    setBackground(S.level);
    updateScoreLabel();
    hud();
    ['ovStart', 'ovOver', 'ovPause', 'ovAch', 'ovStats'].forEach(close);
    startMusic();
    track(mode === 'normal' ? 'game-start' : 'game-start/' + mode, 'Partida iniciada (' + mode + ')');
  }

  function nearMisses(prevBest, isRecord) {
    const out = [];
    if (!isRecord && prevBest > 0 && S.score < prevBest && S.score >= prevBest * 0.8) {
      out.push(t('near_record', { d: prevBest - S.score }));
    }
    const left = S.goal - S.eaten;
    if (left > 0 && left <= 3 && S.eaten > 0) out.push(t('near_level', { k: left, n: S.level + 1 }));
    let bestA = null, bestR = 0;
    ACHS.forEach(a => {
      if (unlocked.has(a.id) || a.type === 'rbest' || a.type === 'ravg') return;
      const r = achCur(a.type) / a.n;
      if (r >= 0.8 && r < 1 && r > bestR) { bestR = r; bestA = a; }
    });
    if (bestA) out.push(t('near_ach', { k: Math.ceil(bestA.n - achCur(bestA.type)), a: achText(bestA) }));
    return out.slice(0, 2);
  }

  function showGameOver() {
    sfx('over');
    const prevBest = best;
    const isRecord = S.score > best;
    if (isRecord) { best = S.score; lsSet('comenum_best', String(best)); }
    if (S.level > maxLevel) maxLevel = S.level;
    lsSet('comenum_maxlevel', String(maxLevel));
    stats.games++;

    // Objetivo semanal
    const w = curWeek();
    w.games++;
    let goalHit = false;
    if (!w.done && w.games >= goal) { w.done = true; stats.weeksDone++; goalHit = true; }

    // Reto diario
    if (S.mode === 'daily') {
      const today = dateKey();
      if (dailyRec.date !== today) dailyRec = { date: today, best: 0, plays: 0 };
      if (dailyRec.plays === 0) stats.daily++;
      dailyRec.plays++;
      dailyRec.best = Math.max(dailyRec.best, S.score);
    }

    checkAchievements();
    saveAll();

    $('finalScore').textContent = S.score;
    $('finalLevel').textContent = S.level;
    $('finalTime').textContent = fmt(S.time);
    $('finalStreak').textContent = S.bestStreak;
    $('finalBest').textContent = best;
    $('newRecord').classList.toggle('hidden', !isRecord);

    // Reacción y precisión de la partida
    const gr = $('goReact');
    if (S.rn > 0) {
      const acc = (S.ok + S.bad) > 0 ? Math.round(S.ok / (S.ok + S.bad) * 100) : 100;
      gr.textContent = '⏱️ ' + t('go_react') + ': ' + fmtSec(S.rsum / S.rn) + '  ·  🎯 ' + t('go_acc') + ': ' + acc + '%';
      gr.classList.remove('hidden');
    } else {
      gr.classList.add('hidden');
    }

    // Mensajes (reto, racha, «casi»…)
    const msgs = [];
    if (S.mode === 'challenge' && S.target > 0) {
      msgs.push(S.score > S.target ? t('ch_won') : t('ch_lost', { d: S.target + 1 - S.score }));
    }
    if (S.mode === 'daily') msgs.push(t('go_daily', { s: dailyRec.best }));
    if (goalHit) msgs.push(t('go_goal'));
    const ds = currentDayStreak();
    if (ds >= 2) msgs.push(t('go_streak', { d: ds }));
    nearMisses(prevBest, isRecord).forEach(m => msgs.push(m));
    const box = $('goMsgs');
    box.innerHTML = '';
    msgs.slice(0, 4).forEach(m => box.appendChild(mk('p', '', m)));

    $('btnChallenge').classList.toggle('hidden', S.score <= 0);
    open('ovOver');
    track('game-over/level-' + S.level, 'Fin de partida en nivel ' + S.level);
  }
  function playAgain() {
    close('ovOver');
    refreshStart();
    if (maxLevel > 1 || S.mode !== 'normal') {
      open('ovStart');   // permite elegir el nivel de inicio
    } else {
      startGame('normal');
    }
  }
  function goMenu() {
    close('ovOver');
    refreshStart();
    open('ovStart');
  }
  function pauseGame() {
    if (!S.playing || S.paused) return;
    S.paused = true;
    open('ovPause');
  }
  function resumeGame() {
    ensureAudio();
    close('ovPause');
    S.paused = false;
  }
  function openHelp() {
    if (S.playing && !S.paused) { S.paused = true; S.helpPaused = true; }
    open('ovHelp');
  }
  function closeHelp() {
    close('ovHelp');
    if (S.helpPaused) { S.paused = false; S.helpPaused = false; }
  }

  // ---------- Compartir ----------
  const baseUrl = () => location.href.split('#')[0];
  async function doShare(text, url, evt) {
    track(evt, evt);
    if (navigator.share) {
      try { await navigator.share({ title: 'Comenum', text, url }); } catch (e) {}
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');
    }
  }
  function shareStart() {
    doShare(best > 0 ? t('share_text_score', { s: best }) : t('share_text'), baseUrl(), 'share');
  }
  function shareScore() {
    const text = S.mode === 'daily'
      ? t('daily_share_text', { n: dayNumber(), s: S.score, l: S.level })
      : t('share_text_score', { s: S.score });
    doShare(text, baseUrl(), 'share');
  }
  function shareChallenge() {
    const url = baseUrl() + '#c=' + S.seed + '.' + S.score + '.' + S.startLv;
    doShare(t('ch_text', { s: S.score }), url, 'challenge-share');
  }

  // ---------- Instalación (PWA) ----------
  let deferredPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('btnInstall').classList.add('hidden');
  if (!isStandalone && isIOS) $('btnInstall').classList.remove('hidden');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) $('btnInstall').classList.remove('hidden');
  });
  window.addEventListener('appinstalled', () => {
    $('btnInstall').classList.add('hidden');
    track('app-installed', 'App instalada');
  });
  $('btnInstall').addEventListener('click', async () => {
    track('install-click', 'Pulsa instalar');
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      $('btnInstall').classList.add('hidden');
    } else if (isIOS) {
      open('ovIOS');
    }
  });

  // ---------- Eventos ----------
  const press = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
  press($('minus'), () => change(-1));
  press($('plus'), () => change(1));
  press($('display'), eat);

  $('btnPlay').addEventListener('click', () => startGame('normal'));
  $('btnDaily').addEventListener('click', () => startGame('daily'));
  $('btnAccept').addEventListener('click', () => startGame('challenge'));
  $('btnAgain').addEventListener('click', playAgain);
  $('btnMenu').addEventListener('click', () => { sfx('button'); goMenu(); });
  $('btnChallenge').addEventListener('click', shareChallenge);
  $('lvMinus').addEventListener('click', () => {
    startLevel = Math.max(1, startLevel - 1);
    $('lvVal').textContent = startLevel;
    ensureAudio(); sfx('button');
  });
  $('lvPlus').addEventListener('click', () => {
    startLevel = Math.min(maxLevel, startLevel + 1);
    $('lvVal').textContent = startLevel;
    ensureAudio(); sfx('button');
  });
  $('btnPause').addEventListener('click', () => { sfx('button'); vibrate(20); pauseGame(); });
  $('btnResume').addEventListener('click', () => { sfx('button'); resumeGame(); });
  $('btnHelp').addEventListener('click', () => { sfx('button'); openHelp(); });
  $('btnHowTo').addEventListener('click', () => { ensureAudio(); sfx('button'); openHelp(); });
  $('btnHelpClose').addEventListener('click', () => { sfx('button'); closeHelp(); });
  $('btnIOSClose').addEventListener('click', () => close('ovIOS'));
  $('btnAch').addEventListener('click', () => { ensureAudio(); sfx('button'); renderAch(); open('ovAch'); });
  $('btnAchClose').addEventListener('click', () => { sfx('button'); close('ovAch'); });
  $('btnStats').addEventListener('click', () => { ensureAudio(); sfx('button'); renderStats(); open('ovStats'); track('stats-open', 'Abre estadísticas'); });
  $('btnStatsClose').addEventListener('click', () => { sfx('button'); close('ovStats'); refreshStart(); });
  $('btnShareStart').addEventListener('click', shareStart);
  $('btnShareOver').addEventListener('click', shareScore);
  $('btnSound').addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    lsSet('comenum_mute', muted ? '1' : '0');
    updateSoundIcon();
    if (!muted) sfx('button');
  });
  $('langSel').addEventListener('change', e => {
    lang = e.target.value;
    lsSet('comenum_lang', lang);
    applyLang();
    track('lang/' + lang, 'Idioma ' + lang);
  });

  // Si llega un enlace de reto con la página ya abierta
  window.addEventListener('hashchange', () => {
    const c = parseChallenge();
    if (c && !S.playing) {
      pendingChallenge = c;
      close('ovOver');
      refreshStart();
      open('ovStart');
    }
  });

  // Pausa automática: llamadas, cambio de app, bloqueo de pantalla, avisos flotantes
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveAll(); pauseGame(); } });
  window.addEventListener('pagehide', () => { saveAll(); pauseGame(); });
  window.addEventListener('blur', pauseGame);

  // Teclado (ordenador): ← − | → + | ↓ comer | ↑ coger sorpresa | P pausa
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'p' || k === 'P') {
      if (S.playing) {
        if (S.paused) { if (!S.helpPaused) resumeGame(); }
        else pauseGame();
      }
      return;
    }
    if (!S.playing || S.paused) return;
    switch (k) {
      case 'ArrowLeft':  change(-1); break;
      case 'ArrowRight': change(1); break;
      case 'ArrowDown':
      case ' ':
      case 'Enter':
        if (!e.repeat) eat();
        break;
      case 'ArrowUp':
        if (!e.repeat) grabSurprise();
        break;
      default: return;
    }
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  // Evitar zoom con gestos en iOS
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---------- Arranque ----------
  applyLang();
  applyTheme();
  updateSoundIcon();
  hud();
  requestAnimationFrame(loop);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
