<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Comenum</title>
<meta name="theme-color" content="#4b2c82">
<meta name="description" content="Comenum">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comenum">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --n1: #ff7b54; --n2: #ffb347; --nf: 21px; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }
  body.cb { --n1: #0d47a1; --n2: #42a5f5; }
  #app {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  /* Adornos de temporada (detrás del juego) */
  #deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .dp { position: absolute; top: -8%; opacity: .55; animation: dfall linear infinite; will-change: transform; }
  .dp.rise { top: auto; bottom: -8%; animation-name: drise; }
  @keyframes dfall { from { transform: translateY(-10vh) rotate(0deg); } to { transform: translateY(115vh) rotate(360deg); } }
  @keyframes drise { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-115vh) rotate(180deg); } }
  @media (prefers-reduced-motion: reduce) { .dp { animation: none; opacity: .25; } }

  /* Efectos (partículas y aros) */
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 45; }
  .pt {
    position: absolute; border-radius: 50%; opacity: 0;
    animation: ptFly .6s ease-out forwards; will-change: transform, opacity;
  }
  @keyframes ptFly {
    0%   { opacity: .9; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); }
  }
  .ring {
    position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.75); animation: ringGo .9s ease-out forwards;
  }
  @keyframes ringGo { from { opacity: .9; transform: scale(.3); } to { opacity: 0; transform: scale(4.2); } }

  /* Barra superior */
  .topbar {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px;
    background: rgba(0,0,0,.18);
    font-size: 14px; font-weight: 700;
  }
  .topbar > div { white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .ib {
    position: relative; flex: none;
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 33px; height: 33px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .ib:active { transform: scale(.92); }
  .ib.off { opacity: .6; }
  .ib.off::after {   /* raya diagonal: el botón está apagado */
    content: ""; position: absolute; left: 20%; right: 20%; top: 50%; height: 2.5px; margin-top: -1px;
    background: #fff; border-radius: 2px; transform: rotate(-45deg);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
  }
  @media (max-width: 400px) {
    .topbar { gap: 6px; padding: 10px 8px; font-size: 13px; }
    .ib { width: 31px; height: 31px; font-size: 15px; }
    .lvl-lbl { display: none; }
    #lvlWrap::before { content: "⭐ "; }
  }

  /* Puntuación */
  #scoreWrap { position: relative; z-index: 1; text-align: center; padding: 8px 0 4px; }
  #scoreWrap .lbl { font-size: 13px; opacity: .85; letter-spacing: 1px; text-transform: uppercase; }
  #score { font-size: 54px; font-weight: 900; color: #ffd23f; text-shadow: 0 3px 8px rgba(0,0,0,.35); line-height: 1.05; }
  #prog { width: 55%; height: 7px; margin: 6px auto 0; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
  #progBar { display: block; height: 100%; width: 0; background: #7dffb0; transition: width .2s; }

  /* Combo */
  #combo {
    height: 26px; margin-top: 4px; font-size: 19px; font-weight: 900; letter-spacing: .5px;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.45); opacity: 0; transition: opacity .2s;
  }
  #combo.on { opacity: 1; }
  #combo[data-m="2"] { color: #ffe66d; }
  #combo[data-m="3"] { color: #ffb347; }
  #combo[data-m="4"] { color: #ff7b54; }
  #combo[data-m="5"] { color: #ff4d6d; }
  #combo.pulse { animation: comboPulse .4s; }
  @keyframes comboPulse { 50% { transform: scale(1.35); } }

  /* Franja de números */
  #strip {
    position: relative; height: 60px; margin: 6px 10px 0;
    background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.28);
    border-radius: 14px; overflow: hidden;
  }
  #strip::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; z-index: 2;
    background: linear-gradient(90deg, rgba(255,60,60,.65), transparent);
  }
  .num {
    position: absolute; left: 0; top: 8px; width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--nf, 21px); font-weight: 800; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    background: linear-gradient(135deg, var(--n1), var(--n2));
    box-shadow: 0 3px 8px rgba(0,0,0,.25);
    will-change: transform;
  }
  .num.gold {
    background: linear-gradient(135deg, #fff176, #ffb300); color: #5a3a00; text-shadow: none;
    box-shadow: 0 0 12px rgba(255,215,0,.9), 0 3px 8px rgba(0,0,0,.25);
  }
  .num.gold::after {
    content: "★"; position: absolute; top: -6px; right: -3px; font-size: 15px; color: #fff;
    text-shadow: 0 0 4px #ff9800, 0 0 2px #000;
  }
  .num.ice {
    background: linear-gradient(135deg, #e1f5fe, #4fc3f7); color: #01579b; text-shadow: none;
    box-shadow: 0 0 12px rgba(129,212,250,.95), 0 3px 8px rgba(0,0,0,.25);
  }
  .num.ice::after {
    content: "❄"; position: absolute; top: -6px; right: -3px; font-size: 15px; color: #fff;
    text-shadow: 0 0 4px #0288d1, 0 0 2px #014f86;
  }
  body.cb .num.gold::after { font-size: 20px; top: -9px; right: -5px; }
  body.cb .num.ice::after { font-size: 20px; top: -9px; right: -5px; }
  .num.wild {
    background: conic-gradient(#ff5e62, #ffd200, #43e97b, #4facfe, #a18cd1, #ff5e62);
    font-size: calc(var(--nf, 21px) + 3px);
  }
  .num.first { box-shadow: 0 0 0 3px #fff, 0 0 14px rgba(255,255,255,.9); }
  .num.gold.first { box-shadow: 0 0 0 3px #fff, 0 0 16px rgba(255,215,0,.95); }
  .num.ice.first { box-shadow: 0 0 0 3px #fff, 0 0 16px rgba(129,212,250,.95); }
  .num.pv { position: static; flex: none; }

  /* Zona de juego (sorpresas) */
  #area { position: relative; flex: 1; }
  #effect {
    position: absolute; top: 8px; left: 0; right: 0; text-align: center; padding: 0 8px;
    font-weight: 800; font-size: 14px; line-height: 1.3; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .sup {
    position: absolute; width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: radial-gradient(circle at 30% 30%, #fff, #ffe6a8);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    animation: floaty 1.6s ease-in-out infinite;
    cursor: pointer;
  }
  .sup.txt { font-size: 24px; font-weight: 900; color: #b36b00; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .pts {
    position: absolute; left: 50%; bottom: 6px; pointer-events: none;
    font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5);
    animation: ptsUp .9s ease-out forwards;
  }
  .pts.gold { color: #ffe14d; font-size: 28px; }
  @keyframes ptsUp {
    0%   { opacity: 0; transform: translate(-50%, 10px) scale(.7); }
    20%  { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -42px) scale(1); }
  }

  /* Personaje (aparece al perder una vida) */
  #chara {
    position: absolute; left: 50%; top: 24%; z-index: 6; width: min(94%, 390px);
    display: flex; align-items: center; gap: 12px; pointer-events: none;
    transform: translateX(-50%); opacity: 0;
  }
  #chara.show { animation: charaAnim 2.3s forwards; }
  @keyframes charaAnim {
    0%   { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.9); }
    12%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.03); }
    18%  { transform: translateX(-50%) translateY(0) scale(1); }
    88%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(1); }
  }
  #chara .av {
    position: relative; flex: none; width: 76px; height: 76px; border-radius: 50%; overflow: hidden;
    background: #cfe8f7; border: 3px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  #chara .av svg { width: 100%; height: 100%; display: block; }
  #chara .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #chara .av.hasimg img { display: block; }
  #chara .av.hasimg svg { display: none; }
  #chara .bub {
    position: relative; flex: 1; background: #fff; color: #2b2150; padding: 12px 14px;
    border-radius: 18px; font-size: 16px; font-weight: 800; line-height: 1.3;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
  }
  #chara .bub::before {
    content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px;
    border: 9px solid transparent; border-left: 0; border-right-color: #fff;
  }

  /* Tutorial */
  #tutHint {
    position: absolute; top: 6px; left: 8px; right: 8px; z-index: 5;
    padding: 10px 12px 8px; border-radius: 16px;
    background: rgba(255,255,255,.96); color: #2b2150; text-align: center;
    font-weight: 800; font-size: 15px; line-height: 1.35;
    box-shadow: 0 8px 22px rgba(0,0,0,.3); pointer-events: none;
  }
  #tutHint button { pointer-events: auto; }
  .tutskip {
    display: block; margin: 6px auto 0; background: none; border: none;
    color: #5b3ea8; font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer;
  }
  .hl { animation: hlGlow 1s ease-in-out infinite; }
  @keyframes hlGlow { 50% { box-shadow: 0 0 0 7px rgba(255,255,255,.85), 0 0 22px rgba(255,255,255,.9); } }

  /* Controles (el margen inferior --cb lo calcula el juego según la posición elegida) */
  .controls {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    height: 76px; margin: 18px 16px var(--cb, 34px);
    background: linear-gradient(#2f7de1, #1a56b8);
    border-radius: 38px;
    box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.2);
  }
  .cbtn {
    flex: 1; height: 100%; background: transparent; border: none; color: #fff;
    font-size: 46px; font-weight: 300; cursor: pointer;
  }
  .cbtn:active { background: rgba(255,255,255,.15); }
  #minus { border-radius: 38px 0 0 38px; padding-right: 44px; }
  #plus  { border-radius: 0 38px 38px 0; padding-left: 44px; }
  .controls.lefty { flex-direction: row-reverse; }
  .controls.lefty #minus { border-radius: 0 38px 38px 0; padding-right: 0; padding-left: 44px; }
  .controls.lefty #plus  { border-radius: 38px 0 0 38px; padding-left: 0; padding-right: 44px; }
  #display {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 100px; height: 100px; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fff3a0, #ffc400);
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
  }
  #display span {
    width: 70px; height: 70px; border-radius: 50%; background: #fff; color: #2b2150;
    display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 800;
  }
  #display:active { transform: translate(-50%, -50%) scale(.95); }
  #display.ok { animation: pop .35s; }
  #display.bad { animation: shake .3s; }
  @keyframes pop { 50% { transform: translate(-50%, -50%) scale(1.15); } }
  @keyframes shake { 25% { transform: translate(-56%, -50%); } 75% { transform: translate(-44%, -50%); } }

  /* Mensajes flotantes */
  #toast {
    position: absolute; left: 50%; top: 42%; z-index: 50; pointer-events: none;
    transform: translate(-50%, -50%); opacity: 0;
    max-width: 85%; text-align: center; padding: 16px 22px; border-radius: 20px;
    font-size: 19px; font-weight: 800; color: #fff;
    background: rgba(255,90,90,.95); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #toast.good { background: rgba(40,190,110,.95); }
  #toast.show { animation: toastAnim 2s forwards; }
  @keyframes toastAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  #achToast {
    position: absolute; left: 50%; top: 58px; z-index: 60; pointer-events: none;
    transform: translateX(-50%); opacity: 0; max-width: 92%; text-align: center;
    padding: 10px 16px; border-radius: 16px; font-size: 14px; font-weight: 800; color: #3d2b00;
    background: linear-gradient(135deg, #ffe259, #ffa751); box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  #achToast.show { animation: achAnim 3s forwards; }
  @keyframes achAnim {
    0%   { opacity: 0; transform: translate(-50%, -14px); }
    10%  { opacity: 1; transform: translate(-50%, 0); }
    85%  { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 0); }
  }

  /* Ventanas */
  .overlay {
    position: absolute; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(15,8,40,.78);
    transition: background .2s;
  }
  .overlay.open { display: flex; }
  .overlay.peek { background: rgba(15,8,40,.2); }
  .overlay.peek .card { opacity: .08; }
  .card {
    width: min(88%, 340px); max-height: 94%; overflow-y: auto;
    padding: 22px 20px; border-radius: 24px; text-align: center;
    background: rgba(255,255,255,.97); color: #2b2150; box-shadow: 0 14px 40px rgba(0,0,0,.4);
    transition: opacity .2s;
  }
  .card h1 { font-size: 40px; letter-spacing: 1px; color: #5b3ea8; margin-bottom: 4px; }
  .card h2 { font-size: 26px; margin-bottom: 10px; color: #d94a4a; }
  .card h3 { font-size: 22px; margin-bottom: 10px; color: #5b3ea8; }
  .card p { margin: 6px 0; font-size: 15px; line-height: 1.4; }
  .card ul { text-align: left; margin: 8px 0 4px 20px; font-size: 14px; line-height: 1.5; }
  .card li { margin-bottom: 4px; }
  .big { font-size: 34px; font-weight: 900; color: #e6a100; }
  .info { font-size: 13px; opacity: .85; }
  .btn {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .btn small { display: block; font-size: 12px; font-weight: 600; opacity: .92; margin-top: 2px; }
  .btn.green { background: linear-gradient(135deg, #25d366, #128c7e); }
  .btn.orange { background: linear-gradient(135deg, #ff9a56, #e0455a); }
  .btn.ghost { background: #eee; color: #4b2c82; }
  .btn:active { transform: scale(.97); }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .btn { font-size: 14px; padding: 10px 6px; }
  .hidden { display: none !important; }

  /* Reto de amigo (banner) */
  .banner {
    background: #fff1d6; border: 2px solid #ffb347; border-radius: 14px;
    padding: 10px; margin: 10px 0 0; font-weight: 800; font-size: 14px; color: #6b3b00;
  }
  .banner .btn { margin-top: 8px; }

  /* Selector de nivel inicial */
  #levelPick { margin: 10px 0 2px; }
  #levelPick .lpLabel { font-size: 14px; font-weight: 700; color: #4b2c82; }
  .picker { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 6px; }
  .picker button {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: #5b3ea8; color: #fff; font-size: 26px; line-height: 1;
  }
  .picker button:active { transform: scale(.92); }
  .picker b { font-size: 32px; min-width: 44px; color: #5b3ea8; }

  /* Selector de idioma */
  #langSel {
    margin-top: 12px; padding: 7px 10px; border-radius: 10px; border: 1px solid #ccc;
    font-size: 14px; background: #fff; color: #2b2150;
  }

  /* Ajustes */
  .posrow { margin-top: 14px; }
  .posrow .lab { font-size: 13px; font-weight: 700; color: #4b2c82; }
  .posrow .chip { min-width: 0; padding: 6px 14px; font-size: 13px; }
  .prev { display: flex; justify-content: center; gap: 8px; margin: 8px 0 4px; }

  /* Selector de tema (ventana de pausa) */
  .themechips { gap: 10px; }
  .tsw {
    width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.14);
  }
  .tsw.sel { border-color: #5b3ea8; transform: scale(1.14); box-shadow: 0 0 0 2px #fff, 0 3px 10px rgba(0,0,0,.35); }
  .tsw:active { transform: scale(.92); }

  /* Logros y temas */
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-top: 7px;
    border-radius: 12px; background: #f1eefb; font-size: 14px; text-align: left;
  }
  .row .sw { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }
  .row .ic { width: 30px; font-size: 22px; text-align: center; flex: none; }
  .row .tx { flex: 1; line-height: 1.25; font-weight: 700; }
  .row .tx small { display: block; font-weight: 400; opacity: .75; font-size: 12px; }
  .row .st { font-size: 13px; font-weight: 800; color: #5b3ea8; flex: none; }
  .row.can { cursor: pointer; }
  .row.lock { opacity: .6; }
  .row.sel { outline: 3px solid #5b3ea8; }
  .row.done { background: #e4f7ea; }
  .cnt { font-size: 13px; opacity: .75; margin-bottom: 2px; }

  /* Estadísticas */
  .tip { background: #fff6d6; border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.4; margin: 8px 0; text-align: left; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .metric { background: #f1eefb; border-radius: 12px; padding: 10px 6px; }
  .metric b { display: block; font-size: 22px; color: #5b3ea8; }
  .metric span { font-size: 12px; opacity: .8; }
  .sec { font-size: 15px; font-weight: 800; color: #5b3ea8; margin-top: 14px; text-align: left; }
  .bar { height: 10px; border-radius: 6px; background: #e3def5; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: #43c68c; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .chip {
    min-width: 54px; padding: 7px 12px; border-radius: 999px; border: 2px solid #5b3ea8;
    background: #fff; color: #5b3ea8; font-weight: 800; font-size: 15px; cursor: pointer;
  }
  .chip.sel { background: #5b3ea8; color: #fff; }
  .wk { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; text-align: left; }
  .wk .l { width: 74px; flex: none; }
  .wk .bar { flex: 1; margin-top: 0; }
  .wk .v { width: 58px; text-align: right; font-weight: 800; flex: none; }
  .dig { display: flex; align-items: flex-end; gap: 4px; height: 84px; margin-top: 10px; }
  .dig .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .dig .c i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: #9575cd; }
  .dig .c.slow i { background: #ef6c00; }
  .dig .c.fast i { background: #1e88e5; }
  .dig .c b { font-size: 12px; margin-top: 2px; color: #4b2c82; }

  /* Mensajes de fin de partida */
  .msgs p { background: #f1eefb; border-radius: 10px; padding: 7px 10px; font-size: 14px; margin: 6px 0; }

  /* Copia de seguridad */
  textarea.code {

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------- Constantes de juego ----------
  const NUM = 40;            // diámetro de cada número (px)
  const SPACING = 45;        // distancia entre números (px) -> 1,8 s a velocidad inicial
  const BASE_SPEED = 25;     // px/segundo en el nivel 1
  const MAX_LIVES = 6;
  const COMBO_STEP = 5;      // cada cuántos números seguidos sube el multiplicador
  const MAX_MULT = 5;        // multiplicador máximo
  const P_WILD = 0.06;       // probabilidad de comodín
  const P_GOLD = 0.09;       // probabilidad de número dorado
  const P_ICE = 0.055;       // probabilidad de que un número normal sea de hielo
  const ICE_SECS = 6;        // duración del hielo (todo a media velocidad)
  const ICE_FACTOR = 0.55;   // velocidad durante el hielo
  const DBL_SECS = 8;        // duración de la sorpresa ×2 puntos
  const TWIN_SECS = 7;       // duración de la sorpresa «doble bocado»
  const FREEZE_SECS = 2.3;   // pausa tras perder una vida (sale el personaje)
  const FX_MAX = 60;         // máximo de partículas a la vez
  const MIN_REACT = 120;     // ms: tiempos menores se descartan (medición poco fiable)
  const MAX_REACT = 8000;    // ms: tiempos mayores se recortan para no distorsionar la media
  const GOALS = [5, 10, 20]; // objetivos semanales posibles (partidas)
  const BACKUP_DAYS = 14;    // días tras los que se recuerda hacer una copia
  const MAX_GOAL = 50;       // tope de números a comer para pasar de nivel
  const MIN_DIGIT_N = 8;     // muestras mínimas por dígito para mostrar su media
  const POS_KEYS = ['low', 'mid', 'high'];   // posición de los botones: baja, media, alta
  const NSIZES = [21, 27, 33];               // tamaño de la cifra de los números (px)
  const TUT = { n1: 3, n2: 7 };              // números del tutorial

  // Curva de dificultad: multiplicador de velocidad según el nivel
  //   niveles 1-4: +0,20 por nivel · niveles 5-15: +0,05 por nivel · a partir del 15: +0,015 por nivel
  function speedFactor(L) {
    if (L <= 4) return 1 + 0.2 * (L - 1);
    if (L <= 15) return 1.6 + 0.05 * (L - 4);
    return 2.15 + 0.015 * (L - 15);
  }
  // Números necesarios para pasar de nivel (con tope)
  function goalFor(L) { return Math.min(MAX_GOAL, 10 + (L - 1) * 5); }

  // ---------- Estadísticas anónimas (GoatCounter) ----------
  function track(path, title) {
    try {
      if (window.goatcounter && typeof window.goatcounter.count === 'function') {
        window.goatcounter.count({ path: path, title: title || path, event: true });
      }
    } catch (e) {}
  }

  // ---------- Fechas y semillas ----------
  const pad2 = n => String(n).padStart(2, '0');
  function dateKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function weekKey(d) {   // lunes de la semana
    d = d || new Date();
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return dateKey(x);
  }
  function yesterdayKey() { const x = new Date(); x.setDate(x.getDate() - 1); return dateKey(x); }
  function dayNumber() {  // nº del reto diario (el día 1 es el 23/11/2026)
    const a = Date.UTC(2026, 10, 23);
    const n = new Date();
    const b = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.max(1, Math.floor((b - a) / 86400000) + 1);
  }
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const randomSeed = () => Math.floor(Math.random() * 4294967296).toString(36);

  // ---------- Logros ----------
  // type: eat, streak, level, score, gold, wild, games, days, daily, weeks (contadores)
  //       rbest (mejor reacción en ms, menor es mejor), ravg (media de la partida en ms, con mínimo de números)
  const ACHS = [
    { id: 'eat100',    type: 'eat',    n: 100,   icon: '🍽️' },
    { id: 'eat500',    type: 'eat',    n: 500,   icon: '🍔' },
    { id: 'eat2000',   type: 'eat',    n: 2000,  icon: '🦖' },

    { id: 'streak25',  type: 'streak', n: 25,    icon: '⚡' },
    { id: 'streak50',  type: 'streak', n: 50,    icon: '🚀' },
    { id: 'level5',    type: 'level',  n: 5,     icon: '🌱' },
    { id: 'level10',   type: 'level',  n: 10,    icon: '🌳' },
    { id: 'level20',   type: 'level',  n: 20,    icon: '🏔️' },
    { id: 'score1000', type: 'score',  n: 1000,  icon: '🥉' },
    { id: 'score5000', type: 'score',  n: 5000,  icon: '🥈' },
    { id: 'score20000',type: 'score',  n: 20000, icon: '🥇' },
    { id: 'gold10',    type: 'gold',   n: 10,    icon: '⭐' },
    { id: 'wild10',    type: 'wild',   n: 10,    icon: '🃏' },
    { id: 'games10',   type: 'games',  n: 10,    icon: '🎮' },

    { id: 'daily7',    type: 'daily',  n: 7,     icon: '🎖️' },
    { id: 'weeks1',    type: 'weeks',  n: 1,     icon: '🎯' }
  ];

  // ---------- Temas de color ----------
  // Los temas con "season" solo están disponibles durante su temporada.
  const THEMES = [
    { id: 'classic', req: null, num: ['#ff7b54', '#ffb347'],
      pal: [['#667eea', '#764ba2'], ['#f093fb', '#f5576c'], ['#4facfe', '#00a8c8'], ['#43e97b', '#1ba39c'],
            ['#fa709a', '#e8a317'], ['#5f72bd', '#9b23ea'], ['#ff9a56', '#e0455a'], ['#2193b0', '#6dd5ed']] },
    { id: 'ocean', req: 'eat100', num: ['#ff9a8b', '#ff6a88'],
      pal: [['#2193b0', '#6dd5ed'], ['#0575e6', '#021b79'], ['#00c6ff', '#0072ff'], ['#1cb5e0', '#000046']] },
    { id: 'sunset', req: 'streak10', num: ['#ffe259', '#ffa751'],
      pal: [['#ff512f', '#dd2476'], ['#f12711', '#f5af19'], ['#ee0979', '#ff6a00'], ['#8e2de2', '#ff5e62']] },
    { id: 'forest', req: 'level5', num: ['#f9d423', '#ff8c00'],
      pal: [['#134e5e', '#71b280'], ['#2e8b2e', '#7bc043'], ['#0b6e4f', '#08312a'], ['#093028', '#237a57']] },
    { id: 'candy', req: 'gold10', num: ['#6a11cb', '#2575fc'],
      pal: [['#ff9a9e', '#d96c9b'], ['#a18cd1', '#e68fc0'], ['#e79ad4', '#7b9fe0'], ['#ff758c', '#ff7eb3']] },
    { id: 'night', req: 'score5000', num: ['#43e97b', '#1ba39c'],
      pal: [['#0f2027', '#2c5364'], ['#232526', '#414345'], ['#1a1a2e', '#16213e'], ['#141e30', '#243b55']] },
    { id: 'neon', req: 'streak25', num: ['#00f260', '#0575e6'],

    { id: 'gold', req: 'level10', num: ['#f9d423', '#e65c00'],
      pal: [['#232526', '#b8860b'], ['#3a1c71', '#d76d77'], ['#7a4b00', '#f7971e'], ['#42275a', '#734b6d']] },
    { id: 'xmas', season: 'xmas', icon: '🎄', req: null, num: ['#e53935', '#b71c1c'],

    { id: 'autumn', season: 'autumn', icon: '🍂', req: null, num: ['#2e7d32', '#66bb6a'],

    { id: 'spring', season: 'spring', icon: '🌸', req: null, num: ['#8e24aa', '#ec407a'],

  // ---------- Temporadas ----------
  // Meses (0 = enero): Navidad en diciembre, verano en julio y agosto, otoño en octubre, primavera en abril

  function tone(f, d, type = 'sine', v = 0.12, delay = 0, to = null) {

    g.gain.setValueAtTime(v, tm);

    o.connect(g); g.connect(master);

  const SFX = {

  // ---------- Música de fondo ----------
  // Suave y sin prisa: un colchón de acordes que respira (las notas entran despacio y se mezclan),
  // una melodía escasa y dulce con silencios, un filtro que quita lo agudo y un eco suave.
  // El ritmo no cambia con el nivel. Cada pocos niveles cambia la progresión de acordes.
  const MUSIC_VOL = 0.5;      // volumen general de la música (0 a 1)
  const BAR = 4.8;            // segundos que dura cada acorde
  const MUSIC_LP = 1100;      // el filtro corta por encima de estos Hz (más bajo = más suave)
  const MEL_PROB = 0.68;      // probabilidad de que suene cada nota de la melodía (más bajo = más espacios)
  const MEL = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];   // do re mi sol la do: escala pentatónica
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = {
    maj7: r => [r, r + 7, r + 16, r + 23],
    m7:   r => [r, r + 7, r + 15, r + 22],
    tri:  r => [r, r + 7, r + 16, r + 19]
  };
  const PROGS = [
    [['maj7', 48], ['m7', 45], ['maj7', 41], ['tri', 43]],
    [['maj7', 41], ['tri', 43], ['m7', 40], ['m7', 45]],
    [['maj7', 48], ['m7', 40], ['maj7', 41], ['tri', 43]]
  ];
  let mus = null, musTimer = null, musNext = 0, musBar = 0, musMel = 3, musOff = true;

  function musicNote(freq, t0, dur, vol, type, attack, release) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.setValueAtTime(vol, t0 + Math.max(attack, dur - release));
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(mus.input);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function scheduleBar(t0) {
    const prog = PROGS[Math.floor((S.level - 1) / 3) % PROGS.length];
    const c = prog[musBar % prog.length];
    // Colchón de acordes: entra despacio y se funde con el siguiente
    CH[c[0]](c[1]).forEach((m, i) => {
      musicNote(mf(m), t0 + i * 0.12, BAR + 2.0, i === 0 ? 0.035 : 0.022, 'triangle', 1.4, 2.0);
    });
    // Melodía escasa: pasos cortos por la escala, con silencios
    [0.5, 1.9, 3.1].forEach(p => {
      if (Math.random() < MEL_PROB) {
        musMel = Math.max(0, Math.min(MEL.length - 1, musMel + Math.floor(Math.random() * 5) - 2));
        musicNote(MEL[musMel], t0 + p, 2.4, 0.05, 'sine', 0.07, 2.33);
      }
    });
    musBar++;
  }
  function musicLoop() {
    musTimer = setTimeout(musicLoop, 250);
    if (!mus || !audioCtx) return;
    const now = audioCtx.currentTime;
    const active = S.playing && !S.paused && !mutedMusic && !document.hidden;
    if (!active) {
      if (!musOff) { mus.gain.gain.setTargetAtTime(0.0001, now, 0.25); musOff = true; }
      return;
    }
    if (musOff) {
      mus.gain.gain.cancelScheduledValues(now);
      mus.gain.gain.setTargetAtTime(MUSIC_VOL, now, 0.8);   // entrada suave
      musOff = false;
      musNext = now + 0.15;
    }
    while (musNext < now + 1.0) {   // se programa con un poco de adelanto
      scheduleBar(musNext);
      musNext += BAR;
    }
  }
  function startMusic() {

      const input = audioCtx.createGain();
      const lp = audioCtx.createBiquadFilter();           // quita lo agudo y lo metálico
      lp.type = 'lowpass'; lp.frequency.value = MUSIC_LP; lp.Q.value = 0.4;
      const out = audioCtx.createGain();                  // volumen general
      out.gain.value = 0.0001;
      const dly = audioCtx.createDelay(1.0);              // eco suave
      dly.delayTime.value = 0.46;
      const fb = audioCtx.createGain(); fb.gain.value = 0.32;
      const wlp = audioCtx.createBiquadFilter();
      wlp.type = 'lowpass'; wlp.frequency.value = 800;
      const wet = audioCtx.createGain(); wet.gain.value = 0.35;
      input.connect(lp);

      lp.connect(dly);
      dly.connect(wlp); wlp.connect(fb); fb.connect(dly);
      wlp.connect(wet); wet.connect(out);

  // ---------- Logros ----------
  function achText(a) {
    return t('ach_' + a.type, { n: a.n.toLocaleString(lang), s: secNum(a.n), m: a.min || 0 });
  }
  function achCur(type) {
    switch (type) {
      case 'eat':    return stats.eaten;
      case 'streak': return Math.max(stats.streak, S.bestStreak || 0);
      case 'level':  return Math.max(maxLevel, S.level);
      case 'score':  return Math.max(best, S.score);
      case 'gold':   return stats.gold;
      case 'wild':   return stats.wild;
      case 'games':  return stats.games;
      case 'days':   return Math.max(days.best, days.streak);
      case 'daily':  return stats.daily;
      case 'weeks':  return stats.weeksDone;
    }
    return 0;
  }
  function achDone(a) {
    if (a.type === 'rbest') return stats.rbest > 0 && stats.rbest <= a.n;
    if (a.type === 'ravg')  return S.rn >= a.min && (S.rsum / S.rn) <= a.n;
    return achCur(a.type) >= a.n;
  }

  // ---------- Copia de seguridad (exportar / importar) ----------
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  // Número seguro: finito, no negativo y con tope
  function nz(v, max) {
    v = Number(v);
    if (!isFinite(v) || v < 0) return 0;
    return Math.min(v, max || 1e12);
  }
  const nzi = (v, max) => Math.floor(nz(v, max));
  const hash7 = s => ('0000000' + hashStr(s).toString(36)).slice(-7);

  function buildBackup() {
    saveAll();
    return {
      v: 1, app: 'comenum', t: Date.now(),
      best: best, maxLevel: maxLevel, goal: goal, theme: themeId,
      stats: stats, days: days, weeks: weeks, daily: dailyRec, ach: Array.from(unlocked)
    };
  }
  function encodeBackup() {
    const json = JSON.stringify(buildBackup());
    const b64 = btoa(json).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return 'COMENUM1.' + b64 + '.' + hash7(json);
  }
  function decodeBackup(text) {
    const s = String(text || '').replace(/\s+/g, '');
    const m = /COMENUM1\.([A-Za-z0-9_-]+)\.([a-z0-9]{7})/.exec(s);
    if (!m) return null;
    let json;
    try {
      let b = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      json = atob(b);
    } catch (e) { return null; }
    if (hash7(json) !== m[2]) return null;
    let o;
    try { o = JSON.parse(json); } catch (e) { return null; }
    if (!o || typeof o !== 'object' || o.app !== 'comenum' || o.v !== 1) return null;
    return o;
  }
  // Combina los datos importados con los del dispositivo: se queda lo mejor de cada lado
  function mergeBackup(o) {
    best = Math.max(best, nzi(o.best));
    maxLevel = Math.max(maxLevel, Math.max(1, nzi(o.maxLevel, 1000)));

    const is = (o.stats && typeof o.stats === 'object') ? o.stats : {};
    ['eaten', 'games', 'gold', 'wild', 'streak', 'ok', 'bad', 'daily', 'weeksDone'].forEach(k => {
      stats[k] = Math.max(stats[k] || 0, nzi(is[k]));
    });
    const irn = nzi(is.rn);
    if (irn > (stats.rn || 0)) { stats.rn = irn; stats.rsum = nz(is.rsum); }   // se queda el conjunto con más muestras
    const irb = nz(is.rbest, MAX_REACT);
    if (irb > 0 && (!stats.rbest || irb < stats.rbest)) stats.rbest = irb;
    // Reacción por dígito: por cada dígito se queda el conjunto con más muestras
    const idn = Array.isArray(is.dn) ? is.dn : [], ids = Array.isArray(is.ds) ? is.ds : [];
    for (let d = 0; d < 10; d++) {
      const n2 = Math.floor(nz(idn[d], 1e9));
      if (n2 > stats.dn[d]) { stats.dn[d] = n2; stats.ds[d] = nz(ids[d], 1e13); }
    }

    const id = (o.days && typeof o.days === 'object') ? o.days : {};
    const il = (typeof id.last === 'string' && DATE_RE.test(id.last)) ? id.last : '';
    if (il && (il > days.last || (il === days.last && nzi(id.streak, 100000) > days.streak))) {
      days.last = il;
      days.streak = nzi(id.streak, 100000);
    }
    days.best = Math.max(days.best || 0, nzi(id.best, 100000));
    days.total = Math.max(days.total || 0, nzi(id.total, 100000));

    const iw = (o.weeks && typeof o.weeks === 'object') ? o.weeks : {};
    Object.keys(iw).forEach(k => {
      if (!DATE_RE.test(k)) return;
      const w = iw[k];
      if (!w || typeof w !== 'object') return;
      const cur = weeks[k] || { n: 0, sum: 0, ok: 0, bad: 0, games: 0, done: false };
      const n2 = nzi(w.n, 1e7);
      if (n2 > cur.n) { cur.n = n2; cur.sum = nz(w.sum, 1e11); }
      cur.ok = Math.max(cur.ok || 0, nzi(w.ok, 1e7));
      cur.bad = Math.max(cur.bad || 0, nzi(w.bad, 1e7));
      cur.games = Math.max(cur.games || 0, nzi(w.games, 1e6));
      cur.done = !!(cur.done || w.done);
      weeks[k] = cur;
    });

    const dd = (o.daily && typeof o.daily === 'object') ? o.daily : {};
    if (typeof dd.date === 'string' && DATE_RE.test(dd.date)) {
      if (dd.date > dailyRec.date) {
        dailyRec = { date: dd.date, best: nzi(dd.best), plays: nzi(dd.plays, 100000) };
      } else if (dd.date === dailyRec.date) {
        dailyRec.best = Math.max(dailyRec.best || 0, nzi(dd.best));
        dailyRec.plays = Math.max(dailyRec.plays || 0, nzi(dd.plays, 100000));
      }
    }

    if (Array.isArray(o.ach)) o.ach.forEach(a => { if (typeof a === 'string' && achById(a)) unlocked.add(a); });
    if (GOALS.includes(o.goal)) goal = o.goal;
    const th = THEMES.find(x => x.id === o.theme);
    if (th && themeUnlocked(th)) themeId = th.id;

    lsSet('comenum_best', String(best));
    lsSet('comenum_maxlevel', String(maxLevel));
    lsSet('comenum_goal', String(goal));
    lsSet('comenum_ach', JSON.stringify(Array.from(unlocked)));
    lsSet('comenum_theme', themeId);
    saveAll();
    applyTheme();
    refreshStart();
  }

  // ---------- Números ----------
  function spawnNumber(overshoot) {
    const rnd = S.rng;
    const el = document.createElement('div');
    const r = rnd();
    let kind = 'normal';
    if (r < P_WILD) kind = 'wild';
    else if (r < P_WILD + P_GOLD) kind = 'gold';
    const v = kind === 'wild' ? -1 : Math.floor(rnd() * 10);
    // Hielo: sustituye a algunos números normales (con su propio generador, el dígito no cambia)
    if (kind === 'normal' && S.rng2() < P_ICE) kind = 'ice';
    el.className = 'num' + (kind !== 'normal' ? ' ' + kind : '');
    el.textContent = kind === 'wild' ? '?' : v;
    $('strip').appendChild(el);
    const x = $('strip').clientWidth - NUM - 6 - overshoot;
    S.numbers.push({ v, x, el, kind });
  }
  function removeNumber(i) {
    const n = S.numbers.splice(i, 1)[0];
    if (n) n.el.remove();

  function tutCheck() {   // se llama tras cambiar el número del visor
    const n = S.numbers[0];
    if (!n) return;
    const match = S.player === n.v;
    if (S.tut === 1 || S.tut === 2) S.tut = match ? 2 : 1;
    else if (S.tut === 3 || S.tut === 4) S.tut = match ? 4 : 3;
    else return;
    const eatStep = (S.tut === 2 || S.tut === 4);
    tutHighlight(eatStep ? ['display'] : ['minus', 'plus']);
    tutHint(eatStep ? t('tut2') : (S.tut === 1 ? t('tut1') : t('tut3')));
  }
  function tutEat() {
    const n = S.numbers[0];
    if (!n) return;
    const d = $('display');
    d.classList.remove('ok', 'bad'); void d.offsetWidth;
    if (n.v === S.player) {
      removeNumber(0);
      sfx('eat');
      d.classList.add('ok');
      popPoints('+10');
      eatFx(n, null);
      if (S.tut === 2) {
        S.tut = 3;
        tutNumber(TUT.n2);
        tutHighlight(['minus', 'plus']);
        tutHint(t('tut3'));
      } else {
        S.tut = 5;
        tutHighlight([]);
        tutHint(t('tut4'), true);
      }
    } else {
      sfx('wrong'); vibrate(40);
      d.classList.add('bad');
      tutHint(t('tut_wrong'));
    }
  }
  function endTutorial() {
    lsSet('comenum_tut', '1');
    tutDone = true;
    $('tutHint').classList.add('hidden');
    tutHighlight([]);
    clearNumbers();
    const next = tutNext;
    tutNext = 'normal';
    if (next === 'menu') {
      S = newState(1, 'normal', 'x');
      setBackground(1); updateScoreLabel(); hud(); refreshStart();
      open('ovStart');
    } else {
      startGame(next);
    }
  }
  function begin(mode) {   // la primera vez se pasa por el tutorial
    if (!tutDone) { tutNext = mode; startTutorial(); }
    else startGame(mode);
  }

  // ---------- Reglas ----------
  // Da los puntos de un número comido. viaEat = true si se comió con el visor (suma racha).
  function awardNumber(n, viaEat) {
    if (viaEat) {
      S.streak++;
      if (S.streak > S.bestStreak) S.bestStreak = S.streak;
    }
    const gold = n.kind === 'gold';
    const pts = 10 * S.level * mult() * (gold ? 3 : 1) * (S.dblLeft > 0 ? 2 : 1);
    S.score += pts;
    S.eaten++;
    stats.eaten++;
    if (gold) stats.gold++;
    if (n.kind === 'wild') stats.wild++;
    return pts;
  }
  function applyKind(n) {   // efecto de los números especiales al comerlos
    if (n.kind === 'ice') {
      S.speedMult = ICE_FACTOR;
      S.effectLeft = ICE_SECS;
      S.effectKey = 'iced';
      sfx('ice');
    }
  }
  function breakStreak() {
    if (S.streak > 0) { S.streak = 0; updateCombo(false); }
  }
  function checkLevel() {
    if (S.eaten >= S.goal) {
      S.level++;
      S.eaten = 0;
      S.goal = goalFor(S.level);
      if (S.level > maxLevel) { maxLevel = S.level; lsSet('comenum_maxlevel', String(maxLevel)); }
      setBackground(S.level);
      toast(t('level_up', { n: S.level }), 'good');
      sfx('level');
      levelFx();
    }
  }
  function checkChallenge() {
    if (S.mode === 'challenge' && !S.passed && S.target > 0 && S.score > S.target) {
      S.passed = true;
      toast(t('ch_passed'), 'good');
    }
  }
  function recordHit(ms, digit) {
    S.ok++; stats.ok++;
    const w = curWeek();
    w.ok++;
    if (ms >= MIN_REACT) {
      ms = Math.min(ms, MAX_REACT);
      S.rn++; S.rsum += ms; if (!S.rbest || ms < S.rbest) S.rbest = ms;
      stats.rn++; stats.rsum += ms; if (!stats.rbest || ms < stats.rbest) stats.rbest = ms;
      w.n++; w.sum += ms;
      if (digit >= 0 && digit <= 9) { stats.dn[digit]++; stats.ds[digit] += ms; }
    }
    if (S.ok === 1) touchDay();
  }
  function recordMiss() {
    S.bad++; stats.bad++;
    curWeek().bad++;
  }
  function eat() {
    if (!S.playing || S.paused) return;
    if (S.mode === 'tutorial') { tutEat(); return; }
    const n = S.numbers[0];
    if (!n) return;   // no hay nada que comer: no cuenta como fallo
    const d = $('display');
    d.classList.remove('ok', 'bad'); void d.offsetWidth;
    if (n.kind === 'wild' || n.v === S.player) {
      const ms = (S.curFirst === n) ? Math.round((S.time - S.firstSince) * 1000) : -1;
      removeNumber(0);
      const before = mult();
      let pts = awardNumber(n, true);
      const after = mult();
      recordHit(ms, n.kind === 'wild' ? -1 : n.v);
      applyKind(n);
      let gold = n.kind === 'gold';
      let extra = null;
      // Doble bocado: el número siguiente desaparece también (da puntos, pero no suma racha)
      if (S.twinLeft > 0 && S.numbers.length) {
        extra = S.numbers[0];
        removeNumber(0);
        pts += awardNumber(extra, false);
        applyKind(extra);
        if (extra.kind === 'gold') gold = true;
      }
      sfx(gold ? 'gold' : 'eat');
      if (after > before) sfx('combo');
      d.classList.add('ok');
      popPoints('+' + pts, gold ? 'gold' : '');
      eatFx(n, extra);
      updateCombo(after > before);
      checkLevel();
      checkChallenge();
      checkAchievements();
    } else {
      recordMiss();
      sfx('wrong');
      vibrate(40);
      d.classList.add('bad');
      breakStreak();
    }
    hud();
  }
  function change(delta) {
    if (!S.playing || S.paused) return;
    S.player = (S.player + delta + 10) % 10;
    sfx('button'); vibrate(20);
    hud();
    if (S.mode === 'tutorial') tutCheck();
  }
  function loseLife() {
    S.lives--;
    breakStreak();
    clearNumbers();           // respiro para el jugador
    S.freeze = FREEZE_SECS;   // el juego se detiene mientras habla el personaje
    S.breath = 1;             // y luego un segundo más sin números nuevos
    S.dist = SPACING;
    S.speedMult = 1; S.effectLeft = 0; S.dblLeft = 0; S.twinLeft = 0;
    updateEffects();
    sfx('lose'); vibrate([120, 60, 120]);
    showChara();
    hud();
    if (S.lives <= 0) {
      S.playing = false;
      stopMusic();
      setTimeout(showGameOver, 2400);
    }
  }

  // ---------- Sorpresas ----------
  const SUP_ICONS = { life: '❤️', slow: '🐌', fast: '⚡', clear: '💥', dbl: '×2', twin: '🍴' };
  function spawnSurprise() {
    const types = ['slow', 'fast', 'clear', 'dbl', 'twin'];
    if (S.lives < MAX_LIVES) types.push('life', 'life');
    const type = types[Math.floor(Math.random() * types.length)];
    const area = $('area');
    const w = area.clientWidth, h = area.clientHeight;
    if (h < 90) return;
    const el = document.createElement('div');
    el.className = 'sup' + (type === 'dbl' ? ' txt' : '');
    el.textContent = SUP_ICONS[type];
    el.style.left = (8 + Math.random() * (w - 72)) + 'px';
    el.style.top = (28 + Math.random() * Math.max(1, h - 100)) + 'px';
    const sup = { el, type, ttl: 4 };
    el.addEventListener('pointerdown', e => { e.preventDefault(); activateSurprise(sup); });
    area.appendChild(el);
    S.surprises.push(sup);
  }
  function removeSurprise(sup) {
    sup.el.remove();
    S.surprises = S.surprises.filter(s => s !== sup);
  }
  function activateSurprise(sup) {
    if (!S.playing || S.paused) return;
    removeSurprise(sup);
    sfx('sup'); vibrate(30);
    switch (sup.type) {
      case 'life':
        if (S.lives < MAX_LIVES) S.lives++;
        toast(t('life_extra'), 'good');
        break;
      case 'slow':
        S.speedMult = 0.5; S.effectLeft = 6; S.effectKey = 'slower';
        break;
      case 'fast':
        S.speedMult = 1.6; S.effectLeft = 5; S.effectKey = 'faster';
        break;
      case 'dbl':
        S.dblLeft = DBL_SECS;
        break;
      case 'twin':
        S.twinLeft = TWIN_SECS;
        break;
      case 'clear': {
        let total = 0;
        for (let k = 0; k < 4 && S.numbers.length; k++) {
          const n = S.numbers[0];
          removeNumber(0);
          total += awardNumber(n, false);   // da puntos, pero no suma racha ni reacción
        }
        if (total > 0) popPoints('+' + total);
        checkLevel();
        toast(t('eaten'), 'good');
        checkChallenge();
        checkAchievements();
        break;
      }
    }
    updateEffects();
    hud();
  }
  function grabSurprise() {
    if (S.surprises.length) activateSurprise(S.surprises[0]);
  }

  // ---------- Bucle principal ----------
  let last = 0, lastSec = -1;
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min((ts - last) / 1000, 0.1);
    last = ts;
    if (!S.playing || S.paused) return;
    if (S.mode === 'tutorial') { paintNumbers(); return; }

    // Pausa tras perder una vida (habla el personaje): el tiempo y los efectos se detienen
    if (S.freeze > 0) { S.freeze -= dt; return; }

    S.time += dt;
    const sec = Math.floor(S.time);
    if (sec !== lastSec) { lastSec = sec; $('time').textContent = fmt(S.time); }

    // Efectos temporales
    if (S.effectLeft > 0) {
      S.effectLeft -= dt;
      if (S.effectLeft <= 0) S.speedMult = 1;
    }
    if (S.dblLeft > 0) S.dblLeft = Math.max(0, S.dblLeft - dt);
    if (S.twinLeft > 0) S.twinLeft = Math.max(0, S.twinLeft - dt);
    updateEffects();

    // Movimiento (la velocidad depende del nivel según la curva de dificultad)
    const speed = BASE_SPEED * speedFactor(S.level) * S.speedMult;
    const move = speed * dt;
    S.numbers.forEach(n => { n.x -= move; });

    // Aparición de números (siempre a la misma distancia entre ellos)
    if (S.breath > 0) {
      S.breath -= dt;
    } else {
      S.dist += move;
      while (S.dist >= SPACING) {
        S.dist -= SPACING;
        spawnNumber(S.dist);
      }
    }

    // Reacción: momento en que un número pasa a ser el primero de la fila
    const f = S.numbers[0] || null;
    if (f !== S.curFirst) { S.curFirst = f; S.firstSince = S.time; }

    // ¿Algún número toca el borde izquierdo?
    if (S.numbers.length && S.numbers[0].x <= 0) {
      loseLife();
      if (!S.playing) return;
    }

    // Pintar
    paintNumbers();

    // Sorpresas
    S.nextSurprise -= dt;
    if (S.nextSurprise <= 0) {
      S.nextSurprise = 9 + Math.random() * 7;
      if (S.surprises.length === 0) spawnSurprise();
    }
    S.surprises.slice().forEach(s => { s.ttl -= dt; if (s.ttl <= 0) removeSurprise(s); });
  }

  // ---------- Flujo de partida ----------
  function startGame(mode) {
    ensureAudio();
    $('tutHint').classList.add('hidden');
    tutHighlight([]);
    hideChara();
    clearNumbers();
    S.surprises.forEach(s => s.el.remove());
    let lv = 1, seed, target = 0;
    if (mode === 'daily') {
      seed = 'daily-' + dateKey();
    } else if (mode === 'challenge' && pendingChallenge) {
      lv = pendingChallenge.lv; seed = pendingChallenge.seed; target = pendingChallenge.score;
      pendingChallenge = null;
      clearHash();
    } else {
      mode = 'normal';
      lv = Math.min(Math.max(1, startLevel), maxLevel);
      seed = randomSeed();
    }
    S = newState(lv, mode, seed);
    S.target = target;
    S.playing = true;
    lastSec = -1;
    $('time').textContent = '00:00';
    clearEffects();
    setBackground(S.level);
    updateScoreLabel();
    hud();
    ['ovStart', 'ovOver', 'ovPause', 'ovAch', 'ovStats', 'ovBackup', 'ovSettings'].forEach(close);
    startMusic();
    track(mode === 'normal' ? 'game-start' : 'game-start/' + mode, 'Partida iniciada (' + mode + ')');
  }

  function nearMisses(prevBest, isRecord) {
    const out = [];
    if (!isRecord && prevBest > 0 && S.score < prevBest && S.score >= prevBest * 0.8) {
      out.push(t('near_record', { d: prevBest - S.score }));
    }
    const left = S.goal - S.eaten;
    if (left > 0 && left <= 3 && S.eaten > 0) out.push(t('near_level', { k: left, n: S.level + 1 }));
    let bestA = null, bestR = 0;
    ACHS.forEach(a => {
      if (unlocked.has(a.id) || a.type === 'rbest' || a.type === 'ravg') return;
      const r = achCur(a.type) / a.n;
      if (r >= 0.8 && r < 1 && r > bestR) { bestR = r; bestA = a; }
    });
    if (bestA) out.push(t('near_ach', { k: Math.ceil(bestA.n - achCur(bestA.type)), a: achText(bestA) }));
    return out.slice(0, 2);
  }

  function showGameOver() {
    sfx('over');
    hideChara();
    const prevBest = best;
    const isRecord = S.score > best;
    if (isRecord) { best = S.score; lsSet('comenum_best', String(best)); }
    if (S.level > maxLevel) maxLevel = S.level;
    lsSet('comenum_maxlevel', String(maxLevel));
    stats.games++;

    // Objetivo semanal
    const w = curWeek();
    w.games++;
    let goalHit = false;
    if (!w.done && w.games >= goal) { w.done = true; stats.weeksDone++; goalHit = true; }

    // Reto diario
    if (S.mode === 'daily') {
      const today = dateKey();
      if (dailyRec.date !== today) dailyRec = { date: today, best: 0, plays: 0 };
      if (dailyRec.plays === 0) stats.daily++;
      dailyRec.plays++;
      dailyRec.best = Math.max(dailyRec.best, S.score);
    }

    checkAchievements();
    saveAll();

    $('finalScore').textContent = S.score;
    $('finalLevel').textContent = S.level;
    $('finalTime').textContent = fmt(S.time);
    $('finalStreak').textContent = S.bestStreak;
    $('finalBest').textContent = best;
    $('newRecord').classList.toggle('hidden', !isRecord);

    // Reacción y precisión de la partida
    const gr = $('goReact');
    if (S.rn > 0) {
      const acc = (S.ok + S.bad) > 0 ? Math.round(S.ok / (S.ok + S.bad) * 100) : 100;
      gr.textContent = '⏱️ ' + t('go_react') + ': ' + fmtSec(S.rsum / S.rn) + '  ·  🎯 ' + t('go_acc') + ': ' + acc + '%';
      gr.classList.remove('hidden');
    } else {
      gr.classList.add('hidden');
    }

    // Mensajes (reto, racha, «casi»…)
    const msgs = [];
    if (S.mode === 'challenge' && S.target > 0) {
      msgs.push(S.score > S.target ? t('ch_won') : t('ch_lost', { d: S.target + 1 - S.score }));
    }
    if (S.mode === 'daily') msgs.push(t('go_daily', { s: dailyRec.best }));
    if (goalHit) msgs.push(t('go_goal'));
    const ds = currentDayStreak();
    if (ds >= 2) msgs.push(t('go_streak', { d: ds }));
    nearMisses(prevBest, isRecord).forEach(m => msgs.push(m));
    const box = $('goMsgs');
    box.innerHTML = '';
    msgs.slice(0, 4).forEach(m => box.appendChild(mk('p', '', m)));

    $('btnChallenge').classList.toggle('hidden', S.score <= 0);
    $('btnShareOver').innerHTML = t('share_score');
    prepareCard();
    open('ovOver');
    track('game-over/level-' + S.level, 'Fin de partida en nivel ' + S.level);
  }
  function playAgain() {
    close('ovOver');
    refreshStart();
    if (maxLevel > 1 || S.mode !== 'normal') {
      open('ovStart');   // permite elegir el nivel de inicio
    } else {
      begin('normal');
    }
  }
  function goMenu() {
    close('ovOver');
    refreshStart();
    open('ovStart');
  }
  function pauseGame() {
    if (!S.playing || S.paused) return;
    S.paused = true;
    renderThemeChips();   // por si se ha desbloqueado un tema o ha cambiado la temporada
    open('ovPause');
  }
  function resumeGame() {
    ensureAudio();
    close('ovPause');
    S.paused = false;
  }
  function openHelp() {
    if (S.playing && !S.paused) { S.paused = true; S.helpPaused = true; }
    open('ovHelp');
  }
  function closeHelp() {
    close('ovHelp');
    if (S.helpPaused) { S.paused = false; S.helpPaused = false; }
  }

  // ---------- Compartir ----------
  const baseUrl = () => (location.protocol.indexOf('http') === 0)
    ? location.origin + location.pathname
    : location.href.split('#')[0].split('?')[0];
  const shortUrl = () => (location.host + location.pathname).replace(/index\.html$/, '').replace(/\/$/, '');
  async function doShare(text, url, evt) {
    track(evt, evt);
    if (navigator.share) {
      try { await navigator.share({ title: 'Comenum', text, url }); } catch (e) {}
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');
    }
  }
  function shareStart() {
    doShare(best > 0 ? t('share_text_score', { s: best }) : t('share_text'), baseUrl(), 'share');
  }
  function shareChallenge() {
    const url = baseUrl() + '#c=' + S.seed + '.' + S.score + '.' + S.startLv;
    doShare(t('ch_text', { s: S.score }), url, 'challenge-share');
  }

  // Tarjeta de resultado (imagen)
  function rr(x, X, Y, W, H, R) {   // rectángulo redondeado
    x.beginPath();
    x.moveTo(X + R, Y);
    x.arcTo(X + W, Y, X + W, Y + H, R);
    x.arcTo(X + W, Y + H, X, Y + H, R);
    x.arcTo(X, Y + H, X, Y, R);
    x.arcTo(X, Y, X + W, Y, R);
    x.closePath();
  }
  function drawCard() {
    const W = 1080, H = 1350;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    const th = curTheme();
    const col = th.pal[(S.level - 1) % th.pal.length];
    const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.07)';
    [[160, 220, 230], [950, 430, 170], [180, 1120, 210], [920, 1190, 250]].forEach(a => {
      x.beginPath(); x.arc(a[0], a[1], a[2], 0, Math.PI * 2); x.fill();
    });
    x.textAlign = 'center';
    x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 14; x.shadowOffsetY = 5;
    x.fillStyle = '#fff'; x.font = '900 128px ' + FONT;
    x.fillText('Comenum', W / 2, 190);
    let tag = '';
    if (S.mode === 'daily') tag = t('daily_tag') + ' #' + dayNumber();
    else if (S.mode === 'challenge' && S.target > 0) tag = t('ch_tag', { s: S.target });
    if (tag) { x.font = '700 54px ' + FONT; x.fillText(tag, W / 2, 270); }
    const sc = String(S.score);
    let fs = 300;
    x.font = '900 ' + fs + 'px ' + FONT;
    while (x.measureText(sc).width > 900 && fs > 110) { fs -= 10; x.font = '900 ' + fs + 'px ' + FONT; }
    x.fillStyle = '#ffd23f';
    x.fillText(sc, W / 2, 640);
    x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0;
    x.fillStyle = 'rgba(255,255,255,.92)'; x.font = '700 50px ' + FONT;
    x.fillText(t('score').toUpperCase(), W / 2, 725);
    const items = [
      [t('level'), String(S.level)],
      [t('streak_best'), String(S.bestStreak)],
      [t('go_react'), S.rn > 0 ? fmtSec(S.rsum / S.rn) : '—']
    ];
    items.forEach((it, i) => {
      const bx = 60 + i * 330;
      x.fillStyle = 'rgba(0,0,0,.24)';
      rr(x, bx, 790, 300, 170, 28); x.fill();
      x.fillStyle = '#fff'; x.font = '800 70px ' + FONT;
      x.fillText(it[1], bx + 150, 877);
      x.fillStyle = 'rgba(255,255,255,.85)'; x.font = '600 30px ' + FONT;
      x.fillText(it[0], bx + 150, 930);
    });
    const rnd = mulberry32(hashStr(S.seed || 'x'));
    for (let i = 0; i < 5; i++) {
      const cx = 240 + i * 150, cy = 1075;
      const gr = x.createLinearGradient(cx - 60, cy - 60, cx + 60, cy + 60);
      gr.addColorStop(0, th.num[0]); gr.addColorStop(1, th.num[1]);
      x.fillStyle = gr;
      x.beginPath(); x.arc(cx, cy, 60, 0, Math.PI * 2); x.fill();
      if (i === 0) { x.lineWidth = 8; x.strokeStyle = '#fff'; x.stroke(); }
      x.fillStyle = '#fff'; x.font = '800 66px ' + FONT;
      x.fillText(String(Math.floor(rnd() * 10)), cx, cy + 23);
    }
    x.fillStyle = '#fff'; x.font = '800 66px ' + FONT;
    x.fillText(t('card_cta'), W / 2, 1210);
    const url = shortUrl();
    x.font = '700 44px ' + FONT;
    const w = x.measureText(url).width + 80;
    x.fillStyle = 'rgba(0,0,0,.3)';
    rr(x, W / 2 - w / 2, 1240, w, 76, 38); x.fill();
    x.fillStyle = '#fff';
    x.fillText(url, W / 2, 1292);
    return c;
  }
  let cardBlob = null;
  function prepareCard() {   // se genera al terminar la partida para poder compartir al instante
    cardBlob = null;
    try { drawCard().toBlob(b => { cardBlob = b; }, 'image/png'); } catch (e) {}
  }
  function flashShareBtn(txt) {
    const b = $('btnShareOver');
    b.textContent = txt;
    setTimeout(() => { b.innerHTML = t('share_score'); }, 2200);
  }
  async function shareCard() {
    track('share-card', 'Compartir tarjeta');
    const url = baseUrl();
    const base = S.mode === 'daily'
      ? t('daily_share_text', { n: dayNumber(), s: S.score, l: S.level })
      : t('share_text_score', { s: S.score });
    const text = base + '\n' + url;
    let blob = cardBlob;
    if (!blob) {
      try { blob = await new Promise(res => drawCard().toBlob(res, 'image/png')); } catch (e) {}
    }
    if (blob) {
      try {
        const file = new File([blob], 'comenum-' + S.score + '.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Comenum', text: text });
          return;
        }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      // Sin compartir archivos (por ejemplo en ordenador): se guarda la imagen
      try {
        const a = document.createElement('a');
        const href = URL.createObjectURL(blob);
        a.href = href;
        a.download = 'comenum-' + S.score + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(href), 3000);
        flashShareBtn(t('card_saved'));
        return;
      } catch (e) {}
    }
    doShare(base, url, 'share');
  }

  // ---------- Instalación (PWA) ----------
  let deferredPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('btnInstall').classList.add('hidden');
  if (!isStandalone && isIOS) $('btnInstall').classList.remove('hidden');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) $('btnInstall').classList.remove('hidden');
  });
  window.addEventListener('appinstalled', () => {
    $('btnInstall').classList.add('hidden');
    track('app-installed', 'App instalada');
  });
  $('btnInstall').addEventListener('click', async () => {
    track('install-click', 'Pulsa instalar');
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      $('btnInstall').classList.add('hidden');
    } else if (isIOS) {
      open('ovIOS');
    }
  });

  // ---------- Eventos ----------
  const press = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
  press($('minus'), () => change(-1));
  press($('plus'), () => change(1));
  press($('display'), eat);

  $('btnPlay').addEventListener('click', () => begin('normal'));
  $('btnDaily').addEventListener('click', () => begin('daily'));
  $('btnAccept').addEventListener('click', () => begin('challenge'));
  $('btnAgain').addEventListener('click', playAgain);
  $('btnMenu').addEventListener('click', () => { sfx('button'); goMenu(); });
  $('btnChallenge').addEventListener('click', shareChallenge);
  $('tutNext').addEventListener('click', endTutorial);
  $('tutSkip').addEventListener('click', endTutorial);
  $('lvMinus').addEventListener('click', () => {
    startLevel = Math.max(1, startLevel - 1);
    $('lvVal').textContent = startLevel;
    ensureAudio(); sfx('button');
  });
  $('lvPlus').addEventListener('click', () => {
    startLevel = Math.min(maxLevel, startLevel + 1);
    $('lvVal').textContent = startLevel;
    ensureAudio(); sfx('button');
  });
  $('btnPause').addEventListener('click', () => { sfx('button'); vibrate(20); pauseGame(); });
  $('btnResume').addEventListener('click', () => { sfx('button'); resumeGame(); });
  $('btnHelp').addEventListener('click', () => { sfx('button'); openHelp(); });
  $('btnHowTo').addEventListener('click', () => { ensureAudio(); sfx('button'); openHelp(); });
  $('btnHelpClose').addEventListener('click', () => { sfx('button'); closeHelp(); });
  $('btnIOSClose').addEventListener('click', () => close('ovIOS'));
  $('btnAch').addEventListener('click', () => { ensureAudio(); sfx('button'); renderAch(); open('ovAch'); });
  $('btnAchClose').addEventListener('click', () => { sfx('button'); close('ovAch'); });
  $('btnStats').addEventListener('click', () => { ensureAudio(); sfx('button'); renderStats(); open('ovStats'); track('stats-open', 'Abre estadísticas'); });
  $('btnStatsClose').addEventListener('click', () => { sfx('button'); close('ovStats'); refreshStart(); });
  $('btnSettings').addEventListener('click', () => { ensureAudio(); sfx('button'); renderSettings(); renderPosChips(); open('ovSettings'); });
  $('btnSettingsClose').addEventListener('click', () => { sfx('button'); close('ovSettings'); refreshStart(); });
  $('btnTutAgain').addEventListener('click', () => { sfx('button'); close('ovSettings'); tutNext = 'menu'; startTutorial(); });
  $('btnBackup').addEventListener('click', openBackup);
  $('backupHint').addEventListener('click', openBackup);
  $('btnBackupClose').addEventListener('click', () => { sfx('button'); close('ovBackup'); refreshStart(); });
  $('bkCopy').addEventListener('click', bkCopy);
  $('bkShare').addEventListener('click', bkShare);
  $('bkDown').addEventListener('click', bkDownload);
  $('bkImport').addEventListener('click', bkImport);
  $('bkFileBtn').addEventListener('click', () => { sfx('button'); $('bkFile').click(); });
  $('bkFile').addEventListener('change', bkFileChosen);
  $('btnShareStart').addEventListener('click', shareStart);
  $('btnShareOver').addEventListener('click', shareCard);
  $('btnMusic').addEventListener('click', () => {
    ensureAudio();
    mutedMusic = !mutedMusic;
    lsSet('comenum_music', mutedMusic ? '0' : '1');
    updateSoundIcons();
    sfx('button');
    track('snd/music-' + (mutedMusic ? 'off' : 'on'), 'Música ' + (mutedMusic ? 'apagada' : 'encendida'));
  });
  $('btnSfx').addEventListener('click', () => {
    ensureAudio();
    mutedSfx = !mutedSfx;
    lsSet('comenum_sfx', mutedSfx ? '0' : '1');
    updateSoundIcons();
    sfx('button');
    track('snd/sfx-' + (mutedSfx ? 'off' : 'on'), 'Efectos ' + (mutedSfx ? 'apagados' : 'encendidos'));
  });
  $('langSel').addEventListener('change', e => {
    lang = e.target.value;
    lsSet('comenum_lang', lang);
    applyLang();
    track('lang/' + lang, 'Idioma ' + lang);
  });

  // Si llega un enlace de reto con la página ya abierta
  window.addEventListener('hashchange', () => {
    const c = parseChallenge();
    if (c && !S.playing) {
      pendingChallenge = c;
      close('ovOver');
      refreshStart();
      open('ovStart');
    }
  });

  // Recalcular la posición de los botones si cambia el tamaño de la pantalla
  window.addEventListener('resize', applyPos);
  window.addEventListener('orientationchange', () => setTimeout(applyPos, 300));

  // Pausa automática: llamadas, cambio de app, bloqueo de pantalla, avisos flotantes
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveAll(); pauseGame(); } });
  window.addEventListener('pagehide', () => { saveAll(); pauseGame(); });
  window.addEventListener('blur', pauseGame);

  // Teclado (ordenador): ← − | → + | ↓ comer | ↑ coger sorpresa | P pausa
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'p' || k === 'P') {
      if (S.playing) {
        if (S.paused) { if (!S.helpPaused) resumeGame(); }
        else pauseGame();
      }
      return;
    }
    if (!S.playing || S.paused) return;
    switch (k) {
      case 'ArrowLeft':  change(-1); break;
      case 'ArrowRight': change(1); break;
      case 'ArrowDown':
      case ' ':
      case 'Enter':
        if (!e.repeat) eat();
        break;
      case 'ArrowUp':
        if (!e.repeat) grabSurprise();
        break;
      default: return;
    }
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  // Evitar zoom con gestos en iOS
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---------- Arranque ----------
  applyLang();
  applyTheme();
  applyAccess();
  applyPos();
  updateSoundIcons();
  hud();
  requestAnimationFrame(loop);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { applyPos(); navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>

<!-- Contador de visitas anónimo (GoatCounter) -->
<script data-goatcounter="https://comenum.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
