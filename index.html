<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }
  #app {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  /* Barra superior */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,.18);
    font-size: 14px; font-weight: 700;
  }
  .topbar .spacer { flex: 1; }
  .ib {
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .ib:active { transform: scale(.92); }

  /* Puntuación */
  #scoreWrap { text-align: center; padding: 10px 0 6px; }
  #scoreWrap .lbl { font-size: 13px; opacity: .85; letter-spacing: 1px; text-transform: uppercase; }
  #score { font-size: 54px; font-weight: 900; color: #ffd23f; text-shadow: 0 3px 8px rgba(0,0,0,.35); line-height: 1.05; }
  #prog { width: 55%; height: 7px; margin: 6px auto 0; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
  #progBar { display: block; height: 100%; width: 0; background: #7dffb0; transition: width .2s; }

  /* Franja de números */
  #strip {
    position: relative; height: 60px; margin: 8px 10px 0;
    background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.28);
    border-radius: 14px; overflow: hidden;
  }
  #strip::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; z-index: 2;
    background: linear-gradient(90deg, rgba(255,60,60,.65), transparent);
  }
  .num {
    position: absolute; left: 0; top: 8px; width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #ff7b54, #ffb347);
    box-shadow: 0 3px 8px rgba(0,0,0,.25);
    will-change: transform;
  }
  .num.first { box-shadow: 0 0 0 3px #fff, 0 0 14px rgba(255,255,255,.9); }

  /* Zona de juego (sorpresas) */
  #area { position: relative; flex: 1; }
  #effect {
    position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-weight: 800; font-size: 15px; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .sup {
    position: absolute; width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: radial-gradient(circle at 30% 30%, #fff, #ffe6a8);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    animation: floaty 1.6s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* Controles */
  .controls {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    height: 66px; margin: 26px 16px 34px;
    background: linear-gradient(#2f7de1, #1a56b8);
    border-radius: 33px;
    box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.2);
  }
  .cbtn {
    flex: 1; height: 100%; background: transparent; border: none; color: #fff;
    font-size: 42px; font-weight: 300; cursor: pointer;
  }
  .cbtn:active { background: rgba(255,255,255,.15); }
  #minus { border-radius: 33px 0 0 33px; padding-right: 40px; }
  #plus  { border-radius: 0 33px 33px 0; padding-left: 40px; }
  #display {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 96px; height: 96px; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fff3a0, #ffc400);
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
  }
  #display span {
    width: 66px; height: 66px; border-radius: 50%; background: #fff; color: #2b2150;
    display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800;
  }
  #display:active { transform: translate(-50%, -50%) scale(.95); }
  #display.ok { animation: pop .35s; }
  #display.bad { animation: shake .3s; }
  @keyframes pop { 50% { transform: translate(-50%, -50%) scale(1.15); } }
  @keyframes shake { 25% { transform: translate(-56%, -50%); } 75% { transform: translate(-44%, -50%); } }

  /* Mensajes flotantes */
  #toast {
    position: absolute; left: 50%; top: 42%; z-index: 50; pointer-events: none;
    transform: translate(-50%, -50%); opacity: 0;
    max-width: 85%; text-align: center; padding: 16px 22px; border-radius: 20px;
    font-size: 19px; font-weight: 800; color: #fff;
    background: rgba(255,90,90,.95); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #toast.good { background: rgba(40,190,110,.95); }
  #toast.show { animation: toastAnim 2s forwards; }
  @keyframes toastAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Ventanas */
  .overlay {
    position: absolute; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(15,8,40,.78);
  }
  .overlay.open { display: flex; }
  .card {
    width: min(88%, 340px); max-height: 94%; overflow-y: auto;
    padding: 22px 20px; border-radius: 24px; text-align: center;
    background: rgba(255,255,255,.97); color: #2b2150; box-shadow: 0 14px 40px rgba(0,0,0,.4);
  }
  .card h1 { font-size: 40px; letter-spacing: 1px; color: #5b3ea8; margin-bottom: 4px; }
  .card h2 { font-size: 26px; margin-bottom: 10px; color: #d94a4a; }
  .card h3 { font-size: 22px; margin-bottom: 10px; color: #5b3ea8; }
  .card p { margin: 6px 0; font-size: 15px; line-height: 1.4; }
  .card ul { text-align: left; margin: 8px 0 4px 20px; font-size: 14px; line-height: 1.5; }
  .big { font-size: 34px; font-weight: 900; color: #e6a100; }
  .btn {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .btn.green { background: linear-gradient(135deg, #25d366, #128c7e); }
  .btn.ghost { background: #eee; color: #4b2c82; }
  .btn:active { transform: scale(.97); }
  .hidden { display: none !important; }

  /* Selector de nivel inicial */
  #levelPick { margin: 10px 0 2px; }
  #levelPick .lpLabel { font-size: 14px; font-weight: 700; color: #4b2c82; }
  .picker { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 6px; }
  .picker button {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: #5b3ea8; color: #fff; font-size: 26px; line-height: 1;
  }
  .picker button:active { transform: scale(.92); }
  .picker b { font-size: 32px; min-width: 44px; color: #5b3ea8; }

  /* Selector de idioma */
  #langSel {
    margin-top: 12px; padding: 7px 10px; border-radius: 10px; border: 1px solid #ccc;
    font-size: 14px; background: #fff; color: #2b2150;
  }
</style>
</head>

      <button class="btn" id="btnPlay" data-i18n="play"></button>
      <button class="btn green" id="btnShareStart" data-i18n="share"></button>
      <button class="btn ghost" id="btnInstall" data-i18n="install"></button>
      <button class="btn ghost" id="btnHowTo" data-i18n="howto"></button>
      <select id="langSel" aria-label="Language"></select>
    </div>
  </div>

  <!-- Pausa -->
  <div class="overlay" id="ovPause">
    <div class="card">
      <h3 data-i18n="pause_title"></h3>
      <button class="btn" id="btnResume" data-i18n="resume"></button>
    </div>
  </div>

  <!-- Ayuda -->
  <div class="overlay" id="ovHelp" style="z-index:110">
    <div class="card">
      <h3 data-i18n="help_title"></h3>
      <ul>
        <li data-i18n="help1"></li>
        <li data-i18n="help2"></li>
        <li data-i18n="help3"></li>
        <li data-i18n="help4"></li>
        <li data-i18n="help5"></li>
        <li data-i18n="help6"></li>
      </ul>
      <button class="btn" id="btnHelpClose" data-i18n="ok"></button>
    </div>
  </div>

  <!-- Instalar en iPhone -->
  <div class="overlay" id="ovIOS" style="z-index:110">
    <div class="card">
      <h3 data-i18n="ios_title"></h3>
      <p data-i18n="ios1"></p>
      <p data-i18n="ios2"></p>
      <p data-i18n="ios3"></p>
      <button class="btn" id="btnIOSClose" data-i18n="ok"></button>
    </div>
  </div>

  <!-- Fin de partida -->
  <div class="overlay" id="ovOver">
    <div class="card">
      <h2 data-i18n="over_title"></h2>
      <p id="newRecord" class="hidden"><b data-i18n="new_record"></b></p>
      <p><span data-i18n="score"></span>: <span class="big" id="finalScore">0</span></p>
      <p><span data-i18n="level"></span>: <b id="finalLevel">1</b> · <span data-i18n="time"></span>: <b id="finalTime">00:00</b></p>
      <p><span data-i18n="record"></span>: <b id="finalBest">0</b></p>
      <button class="btn" id="btnAgain" data-i18n="again"></button>
      <button class="btn green" id="btnShareOver" data-i18n="share_score"></button>
    </div>
  </div>
</div>

    },
    it: {

      install: `📲 Installa sul telefono`, howto: `❓ Come si gioca`,
      start_level: `Inizia dal livello`,
      pause_title: `Gioco in pausa`, resume: `▶ Continua`,
      help_title: `Come si gioca?`,
      help1: `I numeri entrano da destra e avanzano verso sinistra.`,
      help2: `Con − e + metti nel display lo stesso numero del primo a sinistra (quello cerchiato di bianco).`,

      help4: `Se un numero tocca il bordo sinistro perdi una vita (massimo 6).`,

      over_title: `Partita finita!`, new_record: `🏆 Nuovo record!`,
      score: `Punteggio`, level: `Livello`, time: `Tempo`,
      again: `🔄 Gioca ancora`, share_score: `📤 Condividi il mio punteggio`,
      life_extra: `Vita extra! ❤️`, slower: `🐌 Più lento`, faster: `⚡ Più veloce`,
      eaten: `Numeri mangiati! 💥`, level_up: `Livello {n}! 🎉`,
      share_text_score: `Ho fatto {s} punti a Comenum! Riesci a battermi? 🔢`,
      share_text: `Prova Comenum, un gioco veloce per mangiare numeri. Quanto resisti? 🔢`,
      funny: [`Più lento di una lumaca! 🐌`, `Devi allenare di più i pollici! 👍`, `Mia nonna è più veloce! 👵`,
              `Dormi o cosa? 😴`, `Anche una tartaruga ti batte! 🐢`, `Ti serve più caffè! ☕`,
              `I numeri ridono di te! 😂`, `Riflessi da bradipo! 🦥`]
    },
    pt: {
      tagline: `Coma os números antes que cheguem à borda.`,
      record: `Recorde`, play: `▶ Jogar`, share: `📤 Compartilhar com um amigo`,
      install: `📲 Instalar no celular`, howto: `❓ Como jogar`,
      start_level: `Começar no nível`,
      pause_title: `Jogo pausado`, resume: `▶ Continuar`,
      help_title: `Como jogar?`,
      help1: `Os números entram pela direita e avançam para a esquerda.`,
      help2: `Com − e + coloque no visor o mesmo número do primeiro da esquerda (o contornado de branco).`,
      help3: `Toque no visor amarelo para comê-lo.`,
      help4: `Se um número tocar a borda esquerda, você perde uma vida (máximo 6).`,
      help5: `Toque nas surpresas: ❤️ vida, 🐌 mais lento, ⚡ mais rápido, 💥 números comidos.`,
      help6: `No computador: ← → para − e +, ↓ para comer, ↑ para pegar uma surpresa.`,
      ok: `Entendi`,
      ios_title: `Instalar no iPhone`,
      ios1: `1. Abra esta página no <b>Safari</b>.`,
      ios2: `2. Toque no botão <b>Compartilhar</b> (o quadrado com a seta para cima).`,
      ios3: `3. Escolha <b>“Adicionar à Tela de Início”</b>.`,
      over_title: `Fim de jogo!`, new_record: `🏆 Novo recorde!`,
      score: `Pontuação`, level: `Nível`, time: `Tempo`,
      again: `🔄 Jogar de novo`, share_score: `📤 Compartilhar minha pontuação`,
      life_extra: `Vida extra! ❤️`, slower: `🐌 Mais lento`, faster: `⚡ Mais rápido`,
      eaten: `Números comidos! 💥`, level_up: `Nível {n}! 🎉`,
      share_text_score: `Fiz {s} pontos no Comenum! Consegue me superar? 🔢`,
      share_text: `Experimente o Comenum, um jogo rápido de comer números. Quanto tempo você aguenta? 🔢`,
      funny: [`Mais lento que uma lesma! 🐌`, `Treine mais esses polegares! 👍`, `Minha avó é mais rápida! 👵`,
              `Está dormindo? 😴`, `Até uma tartaruga ganha de você! 🐢`, `Você precisa de mais café! ☕`,
              `Os números estão rindo de você! 😂`, `Reflexos de preguiça! 🦥`]
    }
  };

  function detectLang() {
    const saved = lsGet('comenum_lang');
    if (saved && I18N[saved]) return saved;
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    const code = String(nav).slice(0, 2).toLowerCase();
    return I18N[code] ? code : 'en';
  }
  let lang = detectLang();
  let T = I18N[lang];
  function t(key, vars) {
    let s = T[key];
    if (s === undefined) s = I18N.en[key] || key;
    if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
    return s;
  }
  function applyLang() {
    T = I18N[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
    $('langSel').value = lang;
  }
  (function buildLangSelect() {
    const sel = $('langSel');
    Object.keys(LANG_NAMES).forEach(code => {
      const o = document.createElement('option');
      o.value = code; o.textContent = LANG_NAMES[code];
      sel.appendChild(o);
    });
  })();

  // ---------- Estado ----------
  let S = newState(1);
  function newState(lv) {
    return {
      playing: false, paused: false, helpPaused: false,
      score: 0, level: lv, lives: 3, player: 1, time: 0,
      eaten: 0, goal: 10 + (lv - 1) * 5,
      numbers: [], dist: SPACING, breath: 0,
      speedMult: 1, effectLeft: 0, effectKey: '',
      surprises: [], nextSurprise: 8
    };
  }

  // ---------- Audio ----------
  let audioCtx = null, master = null, musicTimer = null, step = 0;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      master = audioCtx.createGain();
      master.gain.value = 1;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state !== 'running') { try { audioCtx.resume(); } catch (e) {} }
  }
  function tone(f, d, type = 'sine', v = 0.12, delay = 0, to = null) {
    if (!audioCtx || muted) return;
    const tm = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, tm);
    if (to) o.frequency.exponentialRampToValueAtTime(to, tm + d);
    g.gain.setValueAtTime(v, tm);
    g.gain.exponentialRampToValueAtTime(0.001, tm + d);
    o.connect(g); g.connect(master);
    o.start(tm); o.stop(tm + d + 0.03);
  }
  const SFX = {
    eat:    () => { tone(660, .09, 'square', .09); tone(990, .12, 'square', .09, .07); },
    button: () => tone(520, .05, 'triangle', .12),
    wrong:  () => tone(160, .18, 'sawtooth', .09),
    lose:   () => { tone(400, .5, 'sawtooth', .12, 0, 90); },
    level:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .14, i * .1)),
    sup:    () => { tone(1200, .1, 'sine', .12); tone(1600, .15, 'sine', .12, .08); },
    over:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, .3, 'triangle', .14, i * .22))
  };
  const sfx = n => { try { SFX[n](); } catch (e) {} };

  const PENT = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
  const MELODY = [0,2,4,2,5,4,2,-1, 0,2,4,7,5,4,2,-1, 3,5,6,5,4,2,0,-1, 0,2,4,5,4,2,0,-1];
  const BASS = [130.81, 98, 110, 87.31];
  function musicTick() {
    musicTimer = setTimeout(musicTick, Math.max(130, 230 - (S.level - 1) * 10));
    if (!S.playing || S.paused || !audioCtx) return;
    const m = MELODY[step % MELODY.length];
    if (m >= 0) tone(PENT[m], .18, 'triangle', .05);
    if (step % 4 === 0) tone(BASS[((step / 4) | 0) % BASS.length], .5, 'sine', .07);
    step++;
  }
  function startMusic() { clearTimeout(musicTimer); step = 0; musicTick(); }
  function stopMusic() { clearTimeout(musicTimer); }

  const vibrate = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  // ---------- Interfaz ----------
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function hud() {
    $('lives').textContent = S.lives;
    $('level').textContent = S.level;
    $('score').textContent = S.score;
    $('dispNum').textContent = S.player;
    $('progBar').style.width = Math.min(100, S.eaten / S.goal * 100) + '%';
  }
  function setBackground() {
    const c = BACKGROUNDS[(S.level - 1) % BACKGROUNDS.length];
    document.body.style.background = `linear-gradient(135deg, ${c[0]} 0%, ${c[1]} 100%)`;
  }
  function toast(msg, cls) {
    const el = $('toast');
    el.textContent = msg;
    el.className = cls || '';
    void el.offsetWidth;
    el.classList.add('show');
  }
  function open(id) { $(id).classList.add('open'); }
  function close(id) { $(id).classList.remove('open'); }
  function updateSoundIcon() { $('btnSound').textContent = muted ? '🔇' : '🔊'; }

  // Pantalla de inicio: récord y selector de nivel
  function refreshStart() {
    startLevel = 1;
    $('bestStart').textContent = best;
    $('lvVal').textContent = startLevel;
    $('levelPick').classList.toggle('hidden', maxLevel <= 1);
  }

  // ---------- Números ----------
  function spawnNumber(overshoot) {
    const el = document.createElement('div');
    el.className = 'num';
    const v = Math.floor(Math.random() * 10);
    el.textContent = v;
    $('strip').appendChild(el);
    const x = $('strip').clientWidth - NUM - 6 - overshoot;
    S.numbers.push({ v, x, el });
  }
  function removeNumber(i) {
    const n = S.numbers.splice(i, 1)[0];
    if (n) n.el.remove();
  }
  function clearNumbers() {
    S.numbers.forEach(n => n.el.remove());
    S.numbers = [];
  }

  // ---------- Reglas ----------
  function award() { S.score += 10 * S.level; S.eaten++; }
  function checkLevel() {
    if (S.eaten >= S.goal) {
      S.level++;
      S.eaten = 0;
      S.goal = 10 + (S.level - 1) * 5;
      if (S.level > maxLevel) { maxLevel = S.level; lsSet('comenum_maxlevel', String(maxLevel)); }
      setBackground();
      toast(t('level_up', { n: S.level }), 'good');
      sfx('level');
    }
  }
  function eat() {
    if (!S.playing || S.paused) return;
    const n = S.numbers[0];
    const d = $('display');
    d.classList.remove('ok', 'bad'); void d.offsetWidth;
    if (n && n.v === S.player) {
      removeNumber(0);
      award();
      sfx('eat');
      d.classList.add('ok');
      checkLevel();
    } else {
      sfx('wrong');
      vibrate(40);
      d.classList.add('bad');
    }
    hud();
  }
  function change(delta) {
    if (!S.playing || S.paused) return;
    S.player = (S.player + delta + 10) % 10;
    sfx('button'); vibrate(20);
    hud();
  }
  function loseLife() {
    S.lives--;
    clearNumbers();           // respiro para el jugador
    S.breath = 2;             // 2 s sin números nuevos
    S.dist = SPACING;
    S.speedMult = 1; S.effectLeft = 0; $('effect').textContent = '';
    sfx('lose'); vibrate([120, 60, 120]);
    const f = T.funny;
    toast(f[Math.floor(Math.random() * f.length)]);
    hud();
    if (S.lives <= 0) {
      S.playing = false;
      stopMusic();
      setTimeout(showGameOver, 1900);
    }
  }

  // ---------- Sorpresas ----------
  function spawnSurprise() {
    const types = ['slow', 'fast', 'clear'];
    if (S.lives < MAX_LIVES) types.push('life', 'life');
    const type = types[Math.floor(Math.random() * types.length)];
    const icons = { life: '❤️', slow: '🐌', fast: '⚡', clear: '💥' };
    const area = $('area');
    const w = area.clientWidth, h = area.clientHeight;
    if (h < 90) return;
    const el = document.createElement('div');
    el.className = 'sup';
    el.textContent = icons[type];
    el.style.left = (8 + Math.random() * (w - 72)) + 'px';
    el.style.top = (28 + Math.random() * Math.max(1, h - 100)) + 'px';
    const sup = { el, type, ttl: 4 };
    el.addEventListener('pointerdown', e => { e.preventDefault(); activateSurprise(sup); });
    area.appendChild(el);
    S.surprises.push(sup);
  }
  function removeSurprise(sup) {
    sup.el.remove();
    S.surprises = S.surprises.filter(s => s !== sup);
  }
  function activateSurprise(sup) {
    if (!S.playing || S.paused) return;
    removeSurprise(sup);
    sfx('sup'); vibrate(30);
    switch (sup.type) {
      case 'life':
        if (S.lives < MAX_LIVES) S.lives++;
        toast(t('life_extra'), 'good');
        break;
      case 'slow':
        S.speedMult = 0.5; S.effectLeft = 6; S.effectKey = 'slower';
        break;
      case 'fast':
        S.speedMult = 1.6; S.effectLeft = 5; S.effectKey = 'faster';
        break;
      case 'clear':
        for (let k = 0; k < 4 && S.numbers.length; k++) { removeNumber(0); award(); }
        checkLevel();
        toast(t('eaten'), 'good');
        break;
    }
    hud();
  }
  function grabSurprise() {
    if (S.surprises.length) activateSurprise(S.surprises[0]);
  }

  // ---------- Bucle principal ----------
  let last = 0, lastSec = -1;
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min((ts - last) / 1000, 0.1);
    last = ts;
    if (!S.playing || S.paused) return;

    S.time += dt;
    const sec = Math.floor(S.time);
    if (sec !== lastSec) { lastSec = sec; $('time').textContent = fmt(S.time); }

    // Efectos temporales
    if (S.effectLeft > 0) {
      S.effectLeft -= dt;
      if (S.effectLeft <= 0) { S.speedMult = 1; $('effect').textContent = ''; }
      else $('effect').textContent = t(S.effectKey) + ' ' + Math.ceil(S.effectLeft) + 's';
    }

    // Movimiento
    const speed = BASE_SPEED * (1 + 0.25 * (S.level - 1)) * S.speedMult;
    const move = speed * dt;
    S.numbers.forEach(n => { n.x -= move; });

    // Aparición de números (siempre a la misma distancia entre ellos)
    if (S.breath > 0) {
      S.breath -= dt;
    } else {
      S.dist += move;
      while (S.dist >= SPACING) {
        S.dist -= SPACING;
        spawnNumber(S.dist);
      }
    }

    // ¿Algún número toca el borde izquierdo?
    if (S.numbers.length && S.numbers[0].x <= 0) {
      loseLife();
      if (!S.playing) return;
    }

    // Pintar
    S.numbers.forEach((n, i) => {
      n.el.style.transform = 'translateX(' + n.x.toFixed(1) + 'px)';
      n.el.classList.toggle('first', i === 0);
    });

    // Sorpresas
    S.nextSurprise -= dt;
    if (S.nextSurprise <= 0) {
      S.nextSurprise = 9 + Math.random() * 7;
      if (S.surprises.length === 0) spawnSurprise();
    }
    S.surprises.slice().forEach(s => { s.ttl -= dt; if (s.ttl <= 0) removeSurprise(s); });
  }

  // ---------- Flujo de partida ----------
  function startGame() {
    ensureAudio();
    clearNumbers();
    S.surprises.forEach(s => s.el.remove());
    const lv = Math.min(Math.max(1, startLevel), maxLevel);
    S = newState(lv);
    S.playing = true;
    lastSec = -1;
    $('time').textContent = '00:00';
    $('effect').textContent = '';
    setBackground();
    hud();
    ['ovStart', 'ovOver', 'ovPause'].forEach(close);
    startMusic();
  }
  function showGameOver() {
    sfx('over');
    const isRecord = S.score > best;
    if (isRecord) { best = S.score; lsSet('comenum_best', String(best)); }
    if (S.level > maxLevel) maxLevel = S.level;
    lsSet('comenum_maxlevel', String(maxLevel));
    $('finalScore').textContent = S.score;
    $('finalLevel').textContent = S.level;
    $('finalTime').textContent = fmt(S.time);
    $('finalBest').textContent = best;
    $('newRecord').classList.toggle('hidden', !isRecord);
    open('ovOver');
  }
  function playAgain() {
    close('ovOver');
    refreshStart();
    if (maxLevel > 1) {
      open('ovStart');   // permite elegir el nivel de inicio
    } else {
      startGame();
    }
  }
  function pauseGame() {
    if (!S.playing || S.paused) return;
    S.paused = true;
    open('ovPause');
  }
  function resumeGame() {
    ensureAudio();
    close('ovPause');
    S.paused = false;
  }
  function openHelp() {
    if (S.playing && !S.paused) { S.paused = true; S.helpPaused = true; }
    open('ovHelp');
  }
  function closeHelp() {
    close('ovHelp');
    if (S.helpPaused) { S.paused = false; S.helpPaused = false; }
  }

  // ---------- Compartir ----------
  async function share(score) {
    const url = location.href.split('#')[0];
    const text = score > 0 ? t('share_text_score', { s: score }) : t('share_text');
    if (navigator.share) {
      try { await navigator.share({ title: 'Comenum', text, url }); } catch (e) {}
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');
    }
  }

  // ---------- Instalación (PWA) ----------
  let deferredPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('btnInstall').classList.add('hidden');
  if (!isStandalone && isIOS) $('btnInstall').classList.remove('hidden');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) $('btnInstall').classList.remove('hidden');
  });
  window.addEventListener('appinstalled', () => $('btnInstall').classList.add('hidden'));
  $('btnInstall').addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null;
      $('btnInstall').classList.add('hidden');
    } else if (isIOS) {
      open('ovIOS');
    }
  });

  // ---------- Eventos ----------
  const press = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
  press($('minus'), () => change(-1));
  press($('plus'), () => change(1));
  press($('display'), eat);

  $('btnPlay').addEventListener('click', startGame);
  $('btnAgain').addEventListener('click', playAgain);
  $('lvMinus').addEventListener('click', () => {
    startLevel = Math.max(1, startLevel - 1);
    $('lvVal').textContent = startLevel;
    ensureAudio(); sfx('button');
  });
  $('lvPlus').addEventListener('click', () => {
    startLevel = Math.min(maxLevel, startLevel + 1);
    $('lvVal').textContent = startLevel;
    ensureAudio(); sfx('button');
  });
  $('btnPause').addEventListener('click', () => { sfx('button'); vibrate(20); pauseGame(); });
  $('btnResume').addEventListener('click', () => { sfx('button'); resumeGame(); });
  $('btnHelp').addEventListener('click', () => { sfx('button'); openHelp(); });
  $('btnHowTo').addEventListener('click', () => { ensureAudio(); sfx('button'); openHelp(); });
  $('btnHelpClose').addEventListener('click', () => { sfx('button'); closeHelp(); });
  $('btnIOSClose').addEventListener('click', () => close('ovIOS'));
  $('btnShareStart').addEventListener('click', () => share(best));
  $('btnShareOver').addEventListener('click', () => share(S.score));
  $('btnSound').addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    lsSet('comenum_mute', muted ? '1' : '0');
    updateSoundIcon();
    if (!muted) sfx('button');
  });
  $('langSel').addEventListener('change', e => {
    lang = e.target.value;
    lsSet('comenum_lang', lang);
    applyLang();
  });

  // Pausa automática: llamadas, cambio de app, bloqueo de pantalla, avisos flotantes
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  window.addEventListener('pagehide', pauseGame);
  window.addEventListener('blur', pauseGame);

  // Teclado (ordenador): ← − | → + | ↓ comer | ↑ coger sorpresa | P pausa
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'p' || k === 'P') {
      if (S.playing) {
        if (S.paused) { if (!S.helpPaused) resumeGame(); }
        else pauseGame();
      }
      return;
    }
    if (!S.playing || S.paused) return;
    switch (k) {
      case 'ArrowLeft':  change(-1); break;
      case 'ArrowRight': change(1); break;
      case 'ArrowDown':
      case ' ':
      case 'Enter':
        if (!e.repeat) eat();
        break;
      case 'ArrowUp':
        if (!e.repeat) grabSurprise();
        break;
      default: return;
    }
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  // Evitar zoom con gestos en iOS
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---------- Arranque ----------
  applyLang();
  refreshStart();
  updateSoundIcon();
  hud();
  requestAnimationFrame(loop);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
